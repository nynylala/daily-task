：你寫得越具體，之後摘要同 ORID 越好寫。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<div class=\"filled\">1. 同事請咗無糖檸檬茶，我覺得被記住喜好。\n2. 下班天橋風好大，我覺得清醒咗。\n3. My friend replied to my English line — I felt brave.</div>", "practice": "<ol class=\"steps\">\n<li>限時 5 分鐘寫三件。</li>\n<li>刪走「好開心／好累」若無事件承托就改寫。</li>\n<li>其中一件改英文。</li>\n<li>一週後重讀，標重複主題。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 點解要具體？</summary><p>答：先可回憶同訓練描寫。</p></details>\n<details><summary>Q2. 可否寫負面？</summary><p>答：呢課聚焦好事；負面另開問題日誌。</p></details>\n<details><summary>Q3. 英文句錯文法怎辦？</summary><p>答：先完成再說；之後可改一版。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["放床頭備忘錄模板。", "常見錯：寫成感恩清單口號。", "可配一張當日照片。", "三件中一件同學習相關。", "唔公開都得，私密先真實。", "連續 7 日先評價有無用。", "下一課：讀後提問術。", "同口語課共用一句英文。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "讀後提問：3 個好問題", "mins": 10, "summary": "讀完唔急寫感想；先問三個好問題，打開思考深度。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "對一篇材料寫出事實題、機制題、應用題各一。 完成練習＋自測，並用一句話總結。", "takeaway": "好問題＞急結論；問題設計決定你學到幾深。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>三層問題：①<strong>事實</strong>：作者實際主張係咩？②<strong>機制</strong>：點解佢話會咁？證據／因果？③<strong>應用</strong>：若屬實，我邊個流程要改？</p>\n<p>好多札記停喺「我覺得好有道理」——提問逼你同文本對話。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<div class=\"filled\">事實：作者主張飯後步行有助血糖。\n機制：肌肉活動增加葡萄糖攝取？\n應用：我可唔可以將行路定死喺日曆？</div>", "practice": "<ol class=\"steps\">\n<li>讀短文。</li>\n<li>寫三題（事／機制／應用）。</li>\n<li>嘗試答機制題（唔知就標「待查」）。</li>\n<li>應用題轉成一個 D（ORID）。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 三層係邊三？</summary><p>答：事實、機制、應用。</p></details>\n<details><summary>Q2. 點解要「待查」？</summary><p>答：誠實標記知識缺口。</p></details>\n<details><summary>Q3. 應用題最終應變成？</summary><p>答：可執行行動。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["會議質詢都用三層。", "常見錯：三題其實同一層。", "對 AI／搜尋前先自己寫機制假設。", "把好問題存題庫。", "教人時用問題引導。", "下一課：段落銜接詞。", "避免情緒題冒充機制題。", "一週精選最佳一問。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "段落銜接：因為所以但是", "mins": 8, "summary": "用少數連接詞令短文邏輯可跟；避免句子互相跳。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "改寫一段無連接詞短文，加入因為／所以／但是／例如。 完成練習＋自測，並用一句話總結。", "takeaway": "連接詞係讀者嘅路標；少而準好過堆砌。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>中文短文常見問題：句子並列但關係不明。入門夠用：<strong>因為、所以、但是、例如、若…則</strong>。</p>\n<p>英文對應：because / so / but / for example / if…then。你嘅「結論先行」段內亦需要呢啲路標。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<div class=\"filled\">原：我要減肥。我坐辦公室。我午飯後行路。\n改：因為我長期坐辦公室，所以午餐後我會急步；但是雨天就改行商場，例如繞兩層。</div>", "practice": "<ol class=\"steps\">\n<li>寫 4 句無連接詞嘅亂序想法。</li>\n<li>加入恰好 3 個連接詞改順。</li>\n<li>讀出聲檢查因果係咪真。</li>\n<li>英譯其中一句。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 連接詞作用？</summary><p>答：標示句間邏輯，方便跟讀。</p></details>\n<details><summary>Q2. 點解唔好堆太多？</summary><p>答：會變冗餘，重點被稀釋。</p></details>\n<details><summary>Q3. 「但是」標記咩關係？</summary><p>答：轉折／限制條件。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["刪掉偽因果（先後唔等於因果）。", "常見錯：所以之後無結論。", "電郵三段各一個路標。", "口語一樣用。", "下一課：清單變段落。", "用顏色標連接詞自查。", "請人只聽連接詞能否重述邏輯。", "同結論先行模板合併。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "清單變段落：匯報一頁紙", "mins": 10, "summary": "把子彈清單收成一段有結論嘅短匯報，練習「書」嘅輸出。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "將 5 個子彈點收成一段 120–180 字匯報（結論先行）。 完成練習＋自測，並用一句話總結。", "takeaway": "清單係材料；段落先係給人讀嘅成品。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>工作上你成日有清單，但上司／同事要嘅係<strong>可掃描段落</strong>：結論、關鍵證據兩點、風險、下一步。</p>\n<p>方法：先排序子彈（重要→次要），刪重複，再套結論先行，最後先讀給自己聽。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<div class=\"filled\">子彈：①版本延遲②缺測試③客戶要demo④可借人手⑤週五前可出。\n段落：結論係週五前可出 demo。因為可借一手測試，主要風險係回歸未满；下一步我今日鎖定範圍並每晚同步進度。</div>", "practice": "<ol class=\"steps\">\n<li>攞你真實 5 個子彈（工作／學習）。</li>\n<li>寫 120–180 字段落。</li>\n<li>別人 10 秒應能劃出結論句。</li>\n<li>壓縮到 80 字再試一版。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 段落開頭放咩？</summary><p>答：結論。</p></details>\n<details><summary>Q2. 清單點解唔夠？</summary><p>答：缺關係同優先序敘事。</p></details>\n<details><summary>Q3. 壓縮版訓練咩？</summary><p>答：取捨同優先級。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["一頁紙原則：一頁內說完。", "常見錯：段落變相還原清單。", "用粗體只粗結論句（電子文件）。", "匯報口語版再縮 30 秒。", "保留原清單做附件。", "下一週重用同一題材寫 ORID。", "請同事劃重點對齊。", "完成即存範本。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}], "hua": [{"title": "簡筆：圓方三角構圖", "mins": 12, "summary": "任何物件先拆成圓／方／三角；今日用茶杯示範，再畫枱上一物。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "用三種基本形完成一件靜物構圖，限時 8 分鐘。 完成練習＋自測，並用一句話總結。", "takeaway": "複雜外形＝基本形組合；先淡線搭骨架，再加重輪廓。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>觀察第一步唔係「畫得似」，而係<strong>降維</strong>：杯身≈圓柱（橢圓＋直線）、耳≈半圓／C 形、底座≈扁橢圓。手機、書包、椅子都一樣。</p>\n<p>流程：①瞇眼看成色塊形狀 ②淡線畫基本形 ③修正比例 ④只加重外輪廓同重要內線 ⑤（可選）淡陰影。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 300 130\" width=\"100%\" style=\"max-width:300px;background:#e0f2fe;border-radius:12px\">\n  <ellipse cx=\"100\" cy=\"35\" rx=\"40\" ry=\"12\" fill=\"none\" stroke=\"#0369a1\" stroke-width=\"2\"/>\n  <path d=\"M60 35 V85 Q100 105 140 85 V35\" fill=\"none\" stroke=\"#0369a1\" stroke-width=\"2\"/>\n  <path d=\"M140 50 Q175 50 175 70 Q175 90 140 85\" fill=\"none\" stroke=\"#0369a1\" stroke-width=\"2\"/>\n  <circle cx=\"230\" cy=\"36\" r=\"16\" fill=\"none\" stroke=\"#0369a1\" stroke-dasharray=\"4\"/>\n  <rect x=\"214\" y=\"60\" width=\"32\" height=\"28\" fill=\"none\" stroke=\"#0369a1\" stroke-dasharray=\"4\"/>\n  <path d=\"M218 110 L246 88 L258 110\" fill=\"none\" stroke=\"#0369a1\" stroke-dasharray=\"4\"/>\n</svg>", "practice": "<ol class=\"steps\">\n<li>臨摹左邊茶杯骨架 1 次（淡線）。</li>\n<li>揀枱上物件，只用圓方三角畫，5 分鐘唔擦膠。</li>\n<li>再花 3 分鐘加重輪廓。</li>\n<li>影相存檔，底下寫物件名。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 點解先基本形？</summary><p>答：控制比例同結構，避免一開始死摳細節。</p></details>\n<details><summary>Q2. 淡線作用？</summary><p>答：容許修正，唔傷紙。</p></details>\n<details><summary>Q3. 今日完成標準？</summary><p>答：睇得出物件結構，唔要求寫實。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["限時係為咗停完美主義。", "常見錯：一開始就畫花紋貼紙。", "用原子筆訓練決斷（進階）。", "靜物燈光單一更好畫。", "連畫三件加深遷移。", "兒童簡筆書可當形狀字典。", "下一課：燈同陰影。", "肩放鬆，手臂帶動。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "每日一畫：一盞燈", "mins": 10, "summary": "觀察燈罩／柱／座結構，並統一光源方向加淡陰影。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "完成一盞燈寫生：外形正確＋陰影方向一致。 完成練習＋自測，並用一句話總結。", "takeaway": "陰影方向全畫統一；先結構後明暗。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>燈＝<strong>燈罩（梯形或橢圓體）＋燈柱（長方／圓柱）＋底座</strong>。假設光從左上：右側同下方偏暗，左側受光。</p>\n<p>入門陰影用「一條帶」就夠，唔使黑成一團。統一光源比「畫得黑」更重要。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 200 120\" width=\"180\" style=\"background:#e0f2fe;border-radius:12px\">\n  <ellipse cx=\"100\" cy=\"28\" rx=\"30\" ry=\"12\" fill=\"#bae6fd\" stroke=\"#0369a1\"/>\n  <path d=\"M70 28 V52 H130 V28\" fill=\"#7dd3fc\" stroke=\"#0369a1\"/>\n  <line x1=\"100\" y1=\"52\" x2=\"100\" y2=\"88\" stroke=\"#0369a1\" stroke-width=\"3\"/>\n  <ellipse cx=\"100\" cy=\"94\" rx=\"24\" ry=\"6\" fill=\"none\" stroke=\"#0369a1\"/>\n  <path d=\"M125 40 L170 78\" stroke=\"#0369a1\" stroke-dasharray=\"3\" opacity=\".5\"/>\n</svg>", "practice": "<ol class=\"steps\">\n<li>實物或相片：先標光源方向箭嘴。</li>\n<li>3 分鐘結構線。</li>\n<li>2 分鐘輪廓。</li>\n<li>3 分鐘右側淡陰影＋底座投影。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 光源箭嘴點解要先畫？</summary><p>答：鎖定全畫陰影方向。</p></details>\n<details><summary>Q2. 入門陰影要幾深？</summary><p>答：淡帶即可，重點係位置啱。</p></details>\n<details><summary>Q3. 燈由邊三部分組成？</summary><p>答：罩、柱、座。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["晚上暖光物件更易見明暗。", "常見錯：左右陰影對角亂飛。", "投影貼住底座邊緣。", "可用手指擦出柔邊。", "下一課：三分法。", "一連七盞燈風格會穩。", "對比前一課茶杯比例。", "拍照同一角度重畫。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "構圖：三分法", "mins": 9, "summary": "井字分割，主體放交叉點，唔一定置中——繪畫同攝影通用。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "用三分法完成一張窗景／杯／植物速寫。 完成練習＋自測，並用一句話總結。", "takeaway": "趣味點放交叉位，畫面更有呼吸同導視線。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>把畫面劃成井字（兩橫兩直）。四個<strong>交叉點</strong>係天然視覺焦點。主體放其中一點，地平線放上或下三分線，避免永遠置中嘅「證件相感」。</p>\n<p>規則可打破，但入門先故意用，建立構圖肌肉。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 240 120\" width=\"200\" style=\"background:#e0f2fe;border-radius:12px\">\n  <rect x=\"20\" y=\"10\" width=\"200\" height=\"100\" fill=\"none\" stroke=\"#0369a1\"/>\n  <path d=\"M86 10 V110 M153 10 V110 M20 43 H220 M20 76 H220\" stroke=\"#0369a1\" stroke-dasharray=\"4\" opacity=\".6\"/>\n  <circle cx=\"153\" cy=\"43\" r=\"8\" fill=\"#0369a1\"/>\n</svg>", "practice": "<ol class=\"steps\">\n<li>紙上先畫淡井字。</li>\n<li>主體放右上或左下交叉（今日指定選一個）。</li>\n<li>5–7 分鐘速寫。</li>\n<li>對比：再畫一張置中版，睇邊張耐看。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 三分法劃幾條線？</summary><p>答：兩橫兩直。</p></details>\n<details><summary>Q2. 主體通常放邊？</summary><p>答：四個交叉點之一。</p></details>\n<details><summary>Q3. 置中一定錯？</summary><p>答：唔係；但入門先練習非置中。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["拍照預覽開網格。", "常見錯：井字畫歪導致比例誤判。", "負空間（空白）一樣係構圖。", "人物眼睛可放上三分線。", "下一課：線條波浪。", "靜物可放對角呼應。", "一週專題：只拍三分法。", "與圓方三角合用。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "線條練習：連續曲線", "mins": 8, "summary": "唔提筆畫波浪同螺旋，放鬆肩臂，訓練手眼流暢。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "完成三行：密波浪、疏密變化、螺旋，肩臂帶動。 完成練習＋自測，並用一句話總結。", "takeaway": "流暢線條來自手臂移動，唔係指尖死描。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>線條係繪畫基本聲調。緊張嘅人會用手指「抠」，線就抖。今日練習<strong>肩放鬆、肘開合、腕隨動</strong>，連續唔提筆。</p>\n<p>呢個訓練直接改善之後人物動態同輪廓品質。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 300 70\" width=\"100%\" style=\"max-width:300px;background:#e0f2fe;border-radius:10px\">\n  <path d=\"M10 35 Q40 10 70 35 T130 35 T190 35 T250 35 T290 35\" fill=\"none\" stroke=\"#0369a1\" stroke-width=\"2\"/>\n</svg>", "practice": "<ol class=\"steps\">\n<li>一行連續波浪，盡量唔停，橫過整頁。</li>\n<li>第二行：疏→密→疏。</li>\n<li>第三行：由內向外螺旋 3 個。</li>\n<li>全程計時 6 分鐘，肩每分鐘甩一甩。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 點解唔提筆？</summary><p>答：練連續控制同節奏。</p></details>\n<details><summary>Q2. 力應來自邊？</summary><p>答：手臂／肩，唔淨手指。</p></details>\n<details><summary>Q3. 線抖點辦？</summary><p>答：放慢、加大動作、站畫亦可。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["可放音樂跟節奏畫。", "常見錯：紙太小導致手指死画。", "用廢紙先熱身。", "下一課：火柴人動態。", "閉眼畫一行感受控制。", "簽字筆／鉛筆都得。", "呢課當繪畫前熱身永久保留。", "錄手部影片自查聳肩。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "簡筆人物：火柴人動態", "mins": 11, "summary": "用火柴人表達企、坐、跑；動態靠脊柱傾斜同腳步前後。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "畫出企／坐／跑三個姿勢，動態可辨。 完成練習＋自測，並用一句話總結。", "takeaway": "先姿態線（action line），再加頭肢體；衣飾之後先加。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>人物入門唔使解剖。 <strong>火柴人</strong>＝圓頭＋脊柱線＋四肢。跑：脊柱前傾、前後腳分開；坐：脊柱後傾或垂直、膝彎；企：重心喺腳掌。</p>\n<p>先畫一條動態弧線，再挂肢體，比例先大概：頭：身約 1:3（簡筆可誇張）。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 280 90\" width=\"240\" style=\"background:#e0f2fe;border-radius:12px\">\n  <g stroke=\"#0369a1\" fill=\"none\" stroke-width=\"2.5\" stroke-linecap=\"round\">\n    <circle cx=\"40\" cy=\"20\" r=\"8\"/><path d=\"M40 28 V55 M28 38 H52 M32 55 L24 78 M48 55 L56 78\"/>\n    <circle cx=\"130\" cy=\"28\" r=\"8\"/><path d=\"M130 36 V50 M110 48 H150 M120 50 L110 70 M140 50 L158 58\"/>\n    <circle cx=\"220\" cy=\"18\" r=\"8\"/><path d=\"M220 26 L208 52 M205 38 L232 42 M208 52 L190 72 M208 52 L230 74\"/>\n  </g>\n</svg>", "practice": "<ol class=\"steps\">\n<li>臨摹三個示範各 1 次。</li>\n<li>唔睇範例默畫企坐跑。</li>\n<li>每個姿勢再畫 2 個變奏（不同傾側）。</li>\n<li>選一個加簡單裙／褲遮住軀幹線。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 跑嘅關鍵係咩？</summary><p>答：脊柱前傾＋前後腳。</p></details>\n<details><summary>Q2. 點解先姿態線？</summary><p>答：先鎖定動態，再細節。</p></details>\n<details><summary>Q3. 衣飾何時加？</summary><p>答：姿態可辨之後。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["30 秒姿態速寫超有效。", "常見錯：雙腳同一條垂直線＝僵。", "用豆沙包／玩偶做模特。", "下一課：負空間觀察。", "對住影片定格畫。", "誇張動態反而易似。", "加簡單臉部之後課。", "保存一頁動態カタログ。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "觀察：負空間描形", "mins": 10, "summary": "唔畫物件本身，改畫佢周圍空白，反而更準。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "用負空間法描一個杯把或椅背缺口。 完成練習＋自測，並用一句話總結。", "takeaway": "負空間幫你校正比例；眼見「洞」有時比眼見「實體」準。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p><strong>負空間（negative space）</strong>係物件之間／周圍嘅空白。畫杯耳時，專畫耳同杯身之間嗰個「洞」嘅形狀，杯耳會自動準。</p>\n<p>呢招專門對付「腦補符號」（例如腦說茶杯耳一定係圓 C，手就畫符號而唔係眼前真相）。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 200 100\" width=\"180\" style=\"background:#e0f2fe;border-radius:12px\">\n  <path d=\"M40 20 V80 H90 V20\" fill=\"none\" stroke=\"#0369a1\"/>\n  <path d=\"M90 35 Q130 35 130 55 Q130 75 90 70\" fill=\"#bae6fd\" stroke=\"#0369a1\"/>\n  <text x=\"140\" y=\"55\" font-size=\"11\" fill=\"#075985\">塗嘅係負空間</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>揀有洞／缺口物件（杯耳、剪刀柄）。</li>\n<li>只塗／只勾負空間 5 分鐘。</li>\n<li>再畫一版正常輪廓對比。</li>\n<li>寫一句：邊版比例較準。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 負空間係咩？</summary><p>答：物件周圍或之間嘅空白形。</p></details>\n<details><summary>Q2. 點解有效？</summary><p>答：減少腦補符號，改看真實形狀。</p></details>\n<details><summary>Q3. 適合糾正咩錯？</summary><p>答：比例同對稱錯誤。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["植物葉隙係超好練習。", "常見錯：又畫返實體線干擾。", "可影印照片塗黑負空間。", "下一課：簡易透視盒。", "同三分法一齊用更穩。", "室內一角剪影練習。", "設計 logo 都常用負空間。", "一週三次短練。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "簡易透視：一個盒子", "mins": 11, "summary": "用一點透視畫紙盒／抽屜，建立空間感。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "完成一個一點透視盒子（含看得到嘅三個面）。 完成練習＋自測，並用一句話總結。", "takeaway": "遠線收斂向消失點；近大遠小。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p><strong>一點透視</strong>：面向你嘅面保持矩形，向縱深嘅邊延長線交於同一 <strong>消失點（VP）</strong>。</p>\n<p>步驟：地平線 → 定 VP → 畫近面矩形 → 由各角連去 VP → 切深度 → 擦多餘線。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 260 120\" width=\"220\" style=\"background:#e0f2fe;border-radius:12px\">\n  <line x1=\"10\" y1=\"40\" x2=\"250\" y2=\"40\" stroke=\"#0369a1\" stroke-dasharray=\"4\"/>\n  <circle cx=\"200\" cy=\"40\" r=\"3\" fill=\"#0369a1\"/>\n  <path d=\"M40 70 H120 V110 H40 Z\" fill=\"none\" stroke=\"#0369a1\" stroke-width=\"2\"/>\n  <path d=\"M120 70 L200 40 L200 40 M40 70 L200 40 M120 110 L200 40 M40 110 L200 40\" stroke=\"#7dd3fc\"/>\n  <path d=\"M120 70 L170 55 L170 85 L120 110\" fill=\"none\" stroke=\"#0369a1\" stroke-width=\"2\"/>\n</svg>", "practice": "<ol class=\"steps\">\n<li>畫地平線同右側 VP。</li>\n<li>畫近面矩形。</li>\n<li>連線到 VP，切出盒子深度。</li>\n<li>加重可見三邊，擦建構線。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 一點透視有幾個消失點？</summary><p>答：1 個。</p></details>\n<details><summary>Q2. 近面點解保持矩形？</summary><p>答：佢正對觀眾，無縱深收縮。</p></details>\n<details><summary>Q3. 深度點樣決定？</summary><p>答：喺通向 VP 嘅線上切一刀。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["走廊／鐵路相片睇透視。", "常見錯：多個面各自消失點。", "兩點透視之後學。", "用尺先，穩再徒手。", "畫抽屜／書疊應用。", "下一課：材質暗示。", "遊戲場景都係透視。", "保存建構線版本對照。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "今日作業：材質暗示", "mins": 9, "summary": "用不同筆觸暗示玻璃、布、木頭——唔使畫滿細節。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "同一杯子畫三次，分別暗示玻璃／陶瓷／木紋。 完成練習＋自測，並用一句話總結。", "takeaway": "材質靠高光、邊緣同筆觸密度暗示，唔靠全寫實。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>玻璃：硬邊高光、透出後面淡線。陶瓷：柔和過渡＋一點高光。木頭：沿結構嘅短紋理線。</p>\n<p>同一外形三套筆觸，你會發現「像不像」好半取決於材質語言。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 300 70\" width=\"100%\" style=\"max-width:300px;background:#e0f2fe;border-radius:10px\">\n  <text x=\"12\" y=\"40\" font-size=\"13\" fill=\"#0369a1\">玻璃＝硬高光　陶瓷＝柔邊　木＝短紋</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>畫三個相同杯形輪廓。</li>\n<li>左：玻璃（留白高光條）。</li>\n<li>中：陶瓷（側邊淡擦影）。</li>\n<li>右：木（短曲線紋）。各 2–3 分鐘。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 玻璃最關鍵暗示？</summary><p>答：硬邊高光／透明。</p></details>\n<details><summary>Q2. 點解唔使畫滿紋理？</summary><p>答：少量筆觸已夠大腦補完。</p></details>\n<details><summary>Q3. 今日標準？</summary><p>答：三張睇得出材質差異。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["金屬＝更強高光對比。", "常見錯：木紋畫到似指紋亂蓋。", "布料用長軟摺線。", "同燈課結合加陰影。", "做材質小色卡一頁。", "水彩／原子筆各試。", "遊戲原畫亦用暗示。", "一週專畫「反光物」。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}], "fit": [{"title": "辦公室：手臂＋腹 12 分鐘", "mins": 12, "summary": "椅撐、側平舉、死蟲、捲腹兩輪——附姿勢提示、安全同互動計時。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "完成 2 輪循環；每動作對齊姿勢提示，腰唔痛。 完成練習＋自測，並用一句話總結。", "takeaway": "坐辦公室都可以練手臂後側同核心；慢控好過猛甩。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>今日循環針對<strong>肱三頭（椅撐）</strong>、<strong>肩側／上背穩定（側平舉）</strong>、<strong>核心抗伸展（死蟲）</strong>、<strong>腹直肌（捲腹）</strong>。全程唔使趴地太久，適合午休。</p>\n<p class=\"safety\">安全：腕／肩／腰若尖銳痛即停；有醫生叮囑就跳過。呼吸唔閉氣。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<div class=\"ex-row\"><div><svg viewBox=\"0 0 64 64\" width=\"64\" height=\"64\"><rect width=\"64\" height=\"64\" rx=\"12\" fill=\"#ffe4e6\"/><g stroke=\"#be123c\" fill=\"none\" stroke-width=\"2.5\" stroke-linecap=\"round\"><circle cx=\"32\" cy=\"14\" r=\"6\"/><path d=\"M32 20 V36 M22 28 H42 M26 36 L20 52 M38 36 L44 52\"/><path d=\"M14 40 H22 V56\"/></g></svg></div><div><div class=\"name\">椅上撐起 ×10</div><div class=\"how\">手握椅邊，臀離椅，肘向後彎再撐直；肩下沉。</div></div></div>\n<div class=\"ex-row\"><div><svg viewBox=\"0 0 64 64\" width=\"64\" height=\"64\"><rect width=\"64\" height=\"64\" rx=\"12\" fill=\"#ffe4e6\"/><g stroke=\"#be123c\" fill=\"none\" stroke-width=\"2.5\" stroke-linecap=\"round\"><circle cx=\"32\" cy=\"16\" r=\"5\"/><path d=\"M32 21 V40 M18 28 L32 24 L46 28 M26 40 L22 54 M38 40 L42 54\"/></g></svg></div><div><div class=\"name\">水瓶側平舉 ×12</div><div class=\"how\">側舉至肩高，慢落；唔聳肩。</div></div></div>\n<div class=\"ex-row\"><div><svg viewBox=\"0 0 64 64\" width=\"64\" height=\"64\"><rect width=\"64\" height=\"64\" rx=\"12\" fill=\"#ffe4e6\"/><g stroke=\"#be123c\" fill=\"none\" stroke-width=\"2.5\" stroke-linecap=\"round\"><circle cx=\"32\" cy=\"22\" r=\"5\"/><path d=\"M32 27 V40 M20 20 L32 32 L44 20 M24 50 L32 40 L40 50\"/></g></svg></div><div><div class=\"name\">死蟲 ×10／邊</div><div class=\"how\">對角手腳伸，腰貼地。</div></div></div>\n<div class=\"ex-row\"><div><svg viewBox=\"0 0 64 64\" width=\"64\" height=\"64\"><rect width=\"64\" height=\"64\" rx=\"12\" fill=\"#ffe4e6\"/><g stroke=\"#be123c\" fill=\"none\" stroke-width=\"2.5\" stroke-linecap=\"round\"><circle cx=\"22\" cy=\"28\" r=\"5\"/><path d=\"M26 32 Q40 28 48 40 M20 48 H46\"/><path d=\"M28 36 L34 46\"/></g></svg></div><div><div class=\"name\">捲腹 ×12</div><div class=\"how\">呼氣肩離地少少，下巴唔贴胸。</div></div></div>\n<p class=\"safety\">互動：撳下方「開始計時」做 40 秒工作／20 秒休（可重設）。</p>\n<div class=\"timer-box\" data-work=\"40\" data-rest=\"20\"><button type=\"button\" class=\"sm primary\" data-act=\"timer\">開始計時 40/20</button> <span class=\"timer-display\">—</span></div>", "practice": "<ol class=\"steps\">\n<li>熱身：肩繞環 20 秒、腰側屈 20 秒。</li>\n<li>依序做完一輪，組間休息 45 秒。</li>\n<li>再做第二輪；第二輪可減 2 次保質素。</li>\n<li>完結行 2 分鐘放鬆。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 椅撐肘應向邊？</summary><p>答：向後，唔向外開太多。</p></details>\n<details><summary>Q2. 死蟲腰離地點辦？</summary><p>答：縮小動作幅度，先保腰貼地。</p></details>\n<details><summary>Q3. 邊種痛要停？</summary><p>答：尖銳關節痛／放射痛。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["腕痛改牆壁掌撐。", "每小時起身行 2 分鐘減靜態傷害。", "水瓶 500ml 入門夠。", "常見錯：聳肩同甩動量太大。", "經期不適應減強度。", "記錄兩輪完成度。", "可配口語課影子跟讀休息時講句。", "聽日可換肱三頭重點日。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "午膳急步任務", "mins": 15, "summary": "飯後急步當有氧；有倒數同配速感覺指引。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "完成 15 分鐘急步：微汗、仍可講短句。 完成練習＋自測，並用一句話總結。", "takeaway": "飯後急步幫血糖同清醒；唔使健身房。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>食完等 5–10 分鐘再行。強度：說話測試——可講短句但唔想唱歌。樓就用樓梯兩層替代一段。</p>\n<p class=\"safety\">膝／腳踝不適改平路；極端天氣改商場。補水，少甜飲。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": ton\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["語氣真誠重要。", "唔好過度道歉搶時間。", "確認句減少做錯。", "同 wrap up 連用。", "寫你常講錯嘅音。", "下一課讚美同回饋。", "角色扮演店員。", "保存句卡。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "讚美同正向回饋", "mins": 8, "summary": "遊戲同職場都用得：Nice kite、Well done、I like that idea。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "三句正向回饋自然講出，完成互讚對話。 完成練習＋自測，並用一句話總結。", "takeaway": "具體讚美好過空泛 good；點出名作行為。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>正向回饋建立團隊氣氛。遊戲：Nice kite! 職場：I like that idea because…（接理由，書課連結）。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<div class=\"line-item\" data-en=\"Nice kite!\">\n  <div class=\"en\">Nice kite! <button type=\"button\" class=\"sm speak-btn\" data-act=\"speak\" data-en=\"Nice kite!\" title=\"朗讀\">🔊</button></div>\n  <div class=\"zh\">牽制漂亮！</div>\n  <div class=\"tip\">重音／發音：NICE / KITE</div><div class=\"tip\">場景：遊戲</div>\n</div><div class=\"line-item\" data-en=\"Well done!\">\n  <div class=\"en\">Well done! <button type=\"button\" class=\"sm speak-btn\" data-act=\"speak\" data-en=\"Well done!\" title=\"朗讀\">🔊</button></div>\n  <div class=\"zh\">做得好！</div>\n  <div class=\"tip\">重音／發音：WELL done</div><div class=\"tip\">場景：通用</div>\n</div><div class=\"line-item\" data-en=\"I like that idea.\">\n  <div class=\"en\">I like that idea. <button type=\"button\" class=\"sm speak-btn\" data-act=\"speak\" data-en=\"I like that idea.\" title=\"朗讀\">🔊</button></div>\n  <div class=\"zh\">我鍾意呢個主意。</div>\n  <div class=\"tip\">重音／發音：LIKE / iDEA</div><div class=\"tip\">場景：會議</div>\n</div><div class=\"line-item\" data-en=\"Thanks for the help.\">\n  <div class=\"en\">Thanks for the help. <button type=\"button\" class=\"sm speak-btn\" data-act=\"speak\" data-en=\"Thanks for the help.\" title=\"朗讀\">🔊</butto AY</td><td>延誤</td><td>There is a slight delay.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"There is a slight delay.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>crowded</strong></td><td>CROW-ded</td><td>擠逼</td><td>The train is crowded.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"The train is crowded.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>destination</strong></td><td>des-ti-NA-tion</td><td>目的地</td><td>What is your destination?</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"What is your destination?\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>Octopus</strong></td><td>OC-to-pus</td><td>八達通</td><td>Please tap your Octopus.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Please tap your Octopus.\" data-lang=\"en-US\">🔊</button></td></tr></tbody></table><div class=\"filled\"><strong>迷你對話</strong><br>A: Does this train go to TST?<br>B: Yes. Transfer at Admiralty for the Island Line.<br>A: Thanks! Which exit for the museum?<br>B: Exit C2.</div><div class=\"line-item\"><div class=\"en\">Which exit is for the mall? <button type=\"button\" class=\"sm speak-btn\" data-act=\"speak\" data-en=\"Which exit is for the mall?\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">去商場出邊個口？</div></div><div class=\"line-item\"><div class=\"en\">I need to transfer to the Island Line. <button type=\"button\" class=\"sm speak-btn\" data-act=\"speak\" data-en=\"I need to transfer to the Island Line.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">我要轉港島線。</div></div><div class=\"line-item\"><div class=\"en\">Excuse me, is this seat taken? <button type=\"button\" class=\"sm speak-btn\" data-act=\"speak\" data-en=\"Excuse me, is this seat taken?\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">呢個位有人嗎？</div></div><div class=\"line-item\"><div class=\"en\">The train is delayed by five minutes. <button type=\"button\" class= ASE-ment</td><td>地下室</td><td>Hunter took them to basement.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Hunter took them to basement.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>gate</strong></td><td>gate</td><td>大門</td><td>Open the gate, I am coming.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Open the gate, I am coming.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>detention</strong></td><td>de-TEN-tion</td><td>門之鑰／門禁（Detention）</td><td>Hunter has Detention — wait the flash.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Hunter has Detention — wait the flash.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>Tide Turner</strong></td><td>TIDE TUR-ner</td><td>翻盤（特質）</td><td>Save with Tide Turner at end game.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Save with Tide Turner at end game.\" data-lang=\"en-US\">🔊</button></td></tr></tbody></table><h4>開局語音段落</h4><div class=\"para-block\"><div class=\"en\">Team, this is Classic mode. Focus on ciphers first. If someone is chaired, call the location and who will rescue. I will kite if the hunter stays. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Team, this is Classic mode. Focus on ciphers first. If someone is chaired, call the location and who will rescue. I will kite if the hunter stays.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh callout\">隊友好，呢鋪係傳統模式。先集中修機。有人上椅就報位置同邊個救。如果監管黏住，我去牽制。</div></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>聽總覽段落兩次</li><li>抄 12 詞</li><li>跟讀每句 🔊</li><li>45 秒模擬開局呼叫</li><li>寫 Classic vs Mimicry 一句分別</li></ol><div class=\"timer-box\" data-work=\"45\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">開局呼叫 45 秒</button></div><div class=\"blank\">分別：Classic… Mimicry…</div><div class=\"q-inline\" data-ans=\"1\"><strong>Classic 主要係？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">投票淘汰</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">1v4 修機／追逃</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">只扮演模仿者</button> <span class=\"q-fb\"></span></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. cipher？</summary><p>密碼機</p></details>\n<details><summary>Q2. kite？</summary><p>牽制</p></details>\n<details><summary>Q3. Classic 唔係？</summary><p>模仿者社交推理局</p></details>\n<details><summary>Q4. Detention？</summary><p>門禁相關特質／用語</p></details>\n</div>", "more": ["Ranked 同 Quick 都屬傳統玩法框架", "報點用地圖簡稱", "唔洗長篇", "同舊救援課合用", "收藏高頻句", "賽後複盤另課", "保持禮貌", "統計打卡"]}, {"title": "【傳統／Classic】修機分工同進度呼叫", "mins": 14, "summary": "密碼機進度、轉機、殘機、誰去門；全段英文＋中文辯解。", "goal": "能連續講 6 句修機進度；完成對話跟讀。", "takeaway": "報％數＋位置＋下一步；唔好只喊「快啲」。", "concept": "<div class=\"callout\"><strong>Mode｜模式：</strong>傳統模式 — Classic</div><div class=\"concept\">\n<p>進度用語要數字化：percent、almost done、last cipher、double cipher。</p>\n<h4>禁忌</h4>\n<p>唔報假進度誤導隊友救援時機。</p>\n</div>", "diagram": "<table class=\"vocab\"><thead><tr><th>單詞</th><th>提示</th><th>中文</th><th>例句</th><th></th></tr></thead><tbody><tr><td><strong>percent</strong></td><td>per-CENT</td><td>百分比</td><td>Cipher is ninety percent.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Cipher is ninety percent.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>last cipher</strong></td><td>last CI-pher</td><td>最後一台</td><td>I am on the last cipher.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I am on the last cipher.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>pop</strong></td><td>pop</td><td>彈機／完成</td><td>Cipher popped — rotating.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Cipher popped — rotating.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>rotate</strong></td><td>RO-tate</td><td>轉機</td><td>Rotate to the gate-side cipher.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Rotate to the gate-side cipher.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>heal</strong></td><td>heal</td><td>治療</td><td>Heal me under the map wall.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Heal me under the map wall.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>ping</strong></td><td>ping</td><td>標點</td><td>Ping the cipher if you need help.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Ping the cipher if you need help.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>contain</strong></td><td>con-TAIN</td><td>拖時間／牽制壓力</td><td>Contain the hunter while we finish.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Contain the hunter while we finish.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>three ciphers</strong></td><td>three CI-phers</td><td>三機</td><td>Still three ciphers left.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Still three ciphers left.\" data-lang=\"en-US\">🔊</button></td></tr></tbody></table><h4>進度段落</h4><div class=\"para-block\"><div class=\"en\">I am forty percent on the chapel cipher. Do not come yet. If the hunter leaves, ping me. When we have one cipher left, someone should move closer to a gate. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I am forty percent on the chapel cipher. Do not come yet. If the hunter leaves, ping me. When we have one cipher left, someone should move closer to a gate.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh callout\">我喺禮拜堂機大概四十％。而家唔使過嚟。如果監管離開就 ping 我。剩一機嗰陣，有人靠近大門位。</div></div><div class=\"dialog\">\n<div class=\"line-item\"><div class=\"en\"><strong>A:</strong> Cipher B is done. I will rotate. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Cipher B is done. I will rotate.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">B 機完成，我轉機。</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>B:</strong> Hunter is coming mid. I will contain. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Hunter is coming mid. I will contain.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">監管入中，我牽制。</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>C:</strong> Thanks. Keep calling percent. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Thanks. Keep calling percent.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">多謝，繼續報進度。</div></div>\n</div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>跟讀對話三輪</li><li>遮中文覆述段落</li><li>計時 60 秒只講進度句</li><li>自寫一句轉機</li></ol><div class=\"timer-box\" data-work=\"60\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">進度語音 60 秒</button></div><div class=\"blank\">自寫轉機：…</div><div class=\"q-inline\" data-ans=\"1\"><strong>pop 意思？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">上椅</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">機完成</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">投票</button> <span class=\"q-fb\"></span></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 報進度要素？</summary><p>％＋位置＋下一步</p></details>\n<details><summary>Q2. rotate？</summary><p>轉機</p></details>\n<details><summary>Q3. 假進度？</summary><p>唔好</p></details>\n</div>", "more": ["用地圖縮寫", "聽隊友再覆述確認", "英文數字練習", "同牽制課合用", "文明催促", "錄音自查", "收藏", "打卡"]}, {"title": "【傳統／Classic】救援、換救、禁止救", "mins": 14, "summary": "救援局全句：誰救、誰牽、半血、二階、地下室；聽讀＋對話。", "goal": "模擬一局救援通話；分清 early chair / late chair。", "takeaway": "先講位置同狀態，再講誰行動。", "concept": "<div class=\"callout\"><strong>Mode｜模式：</strong>傳統模式 — Classic</div><div class=\"concept\">\n<p>rescue call 公式：Who + Where + Chair state + Can/Cannot rescue + Who kites。</p>\n</div>", "diagram": "<table class=\"vocab\"><thead><tr><th>單詞</th><th>提示</th><th>中文</th><th>例句</th><th></th></tr></thead><tbody><tr><td><strong>early chair</strong></td><td>EAR-ly chair</td><td>前期椅</td><td>Early chair — keep decoding.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Early chair — keep decoding.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>second stage</strong></td><td>SE-cond stage</td><td>二階</td><td>They are second stage — rescue now!</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"They are second stage — rescue now!\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>half health</strong></td><td>half health</td><td>半血</td><td>I am half health after the hit.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I am half health after the hit.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>trade</strong></td><td>trade</td><td>換救／換椅</td><td>I will trade if needed.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I will trade if needed.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>body block</strong></td><td>BODY block</td><td>擋刀</td><td>I can body block the hit.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I can body block the hit.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>basement chair</strong></td><td>BASE-ment chair</td><td>地下室椅</td><td>Basement chair — need Tide.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Basement chair — need Tide.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>do not rescue</strong></td><td>do not RE-scue</td><td>禁止救</td><td>Do not rescue — hunter is camping hard.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Do not rescue — hunter is camping hard.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>I got save</strong></td><td>I got save</td><td>我去救</td><td>I got the save; you kite away.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I got the save; you kite away.\" data-lang=\"en-US\">🔊</button></td></tr></tbody></table><h4>救援段落</h4><div class=\"para-block\"><div class=\"en\">Hunter chaired our teammate at the hospital. It is second stage. I have Tide Turner and I will rescue. Please kite the hunter away after the save. Do not stack on the chair. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Hunter chaired our teammate at the hospital. It is second stage. I have Tide Turner and I will rescue. Please kite the hunter away after the save. Do not stack on the chair.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh callout\">監管喺醫院上椅，已經二階。我有翻盤，我去救。救完請把監管牽走。唔好全部叠喺椅邊。</div></div><div class=\"dialog\">\n<div class=\"line-item\"><div class=\"en\"><strong>A:</strong> Need rescue! Factory chair, second stage! <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Need rescue! Factory chair, second stage!\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">救！工廠椅，二階！</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>B:</strong> I got save. Tide ready. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I got save. Tide ready.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">我救，翻盤好咗。</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>C:</strong> I will kite after. Do not stack. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I will kite after. Do not stack.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">我拖；唔好叠。</div></div>\n</div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>聽段落→標公式五欄</li><li>跟讀對話</li><li>40 秒只喊救援句</li><li>寫一句「禁止救」原因</li></ol><div class=\"timer-box\" data-work=\"40\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">救援呼叫</button></div><div class=\"blank\">禁止救因為：…</div><div class=\"q-inline\" data-ans=\"1\"><strong>early chair 常做？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">全隊去救</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">繼續修機觀察</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">立即開門</button> <span class=\"q-fb\"></span></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 救援公式？</summary><p>誰／邊／狀態／可否／誰牽</p></details>\n<details><summary>Q2. trade？</summary><p>換救</p></details>\n<details><summary>Q3. stack？</summary><p>全部叠埋一齊（常危險）</p></details>\n</div>", "more": ["Tide／Borrowed Time 英文名", "營地（camp）說法", "文明催救", "同舊救援課合併複習", "錄音", "收藏金句", "地圖名英文化", "打卡"]}, {"title": "【傳統／Classic】牽制板窗同報點", "mins": 13, "summary": "板區、窗、急停、報點方向；大量 when-to-say 短句。", "goal": "背 10 句板窗呼叫；完成自測。", "takeaway": "報點＝方向＋地標＋監管狀態（追／放棄／傳送）。", "concept": "<div class=\"callout\"><strong>Mode｜模式：</strong>傳統模式 — Classic</div><div class=\"concept\">\n<p>pallet＝板；window＝窗；stun＝晕；mind game＝心理位。</p>\n</div>", "diagram": "<table class=\"vocab\"><thead><tr><th>單詞</th><th>提示</th><th>中文</th><th>例句</th><th></th></tr></thead><tbody><tr><td><strong>pallet</strong></td><td>PAL-let</td><td>板</td><td>I have a pallet ready.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I have a pallet ready.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>window</strong></td><td>WIN-dow</td><td>窗</td><td>Looping the window area.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Looping the window area.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>stun</strong></td><td>stun</td><td>晕／硬控</td><td>Pallet stun landed!</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Pallet stun landed!\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>mind game</strong></td><td>mind game</td><td>心理位</td><td>Hunter mind-gamed the pallet.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Hunter mind-gamed the pallet.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>tunnel</strong></td><td>TUN-nel</td><td>集火追同一人</td><td>Hunter is tunneling me.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Hunter is tunneling me.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>presence</strong></td><td>PRES-ence</td><td>衝動／存在感</td><td>Hunter presence is high — careful.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Hunter presence is high — careful.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>blink</strong></td><td>blink</td><td>閃現</td><td>Hunter used Blink — watch the angle.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Hunter used Blink — watch the angle.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>teleport</strong></td><td>TEL-e-port</td><td>傳送</td><td>Hunter teleported to cipher.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Hunter teleported to cipher.\" data-lang=\"en-US\">🔊</button></td></tr></tbody></table><div class=\"line-item\"><div class=\"en\">Hunter lost me near the red chair area. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Hunter lost me near the red chair area.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">監管喺紅椅區斷蹭。</div></div><div class=\"line-item\"><div class=\"en\">I stunned with pallet; still kiting east. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I stunned with pallet; still kiting east.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">板晕到，繼續向東拖。</div></div><div class=\"line-item\"><div class=\"en\">Do not decode that cipher — hunter is coming. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Do not decode that cipher — hunter is coming.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">唔好修嗰台，監管過嚟。</div></div><h4>牽制段落</h4><div class=\"para-block\"><div class=\"en\">I am kiting at the wood pallet zone. Two windows left. If I go down, please finish the cipher before rescue. Call if the hunter switches to you. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I am kiting at the wood pallet zone. Two windows left. If I go down, please finish the cipher before rescue. Call if the hunter switches to you.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh callout\">我喺木板區牽制，仲有兩窗。如果我倒地，請先完成機再救。監管轉火你就喊。</div></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>每句 🔊 兩次</li><li>遮中文講報點</li><li>50 秒模擬拖刀語音</li><li>畫自己常用板區英文名</li></ol><div class=\"timer-box\" data-work=\"50\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">牽制語音</button></div><div class=\"q-inline\" data-ans=\"1\"><strong>tunnel 係？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">開門</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">集火同一人</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">投票</button> <span class=\"q-fb\"></span></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. pallet？</summary><p>板</p></details>\n<details><summary>Q2. 報點要素？</summary><p>方向＋地標＋狀態</p></details>\n<details><summary>Q3. Blink？</summary><p>閃現</p></details>\n</div>", "more": ["角色技能英文另課", "唔劇透私密資訊", "短句優先", "同地圖詞合用", "複盤影片跟讀", "文明", "收藏", "打卡"]}, {"title": "【傳統／Classic】殘局大門同特質用語", "mins": 13, "summary": "最後一機、大門、門禁、飛輪／膝撞等常用英文呼叫。", "goal": "講出一套殘局流程英文；對話跟讀過關。", "takeaway": "殘局先講門邊誰開、誰騙門、誰抗門禁。", "concept": "<div class=\"callout\"><strong>Mode｜模式：</strong>傳統模式 — Classic</div><div class=\"concept\">\n<p>end game：last cipher → gate → detention check → exit。</p>\n</div>", "diagram": "<table class=\"vocab\"><thead><tr><th>單詞</th><th>提示</th><th>中文</th><th>例句</th><th></th></tr></thead><tbody><tr><td><strong>end game</strong></td><td>end game</td><td>殘局</td><td>This is end game — stay calm.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"This is end game — stay calm.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>open gate</strong></td><td>open gate</td><td>開門</td><td>I will open the front gate.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I will open the front gate.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>bait gate</strong></td><td>bait gate</td><td>騙門</td><td>Bait the other gate for me.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Bait the other gate for me.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>exit</strong></td><td>EX-it</td><td>出逃</td><td>I exited — good luck.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I exited — good luck.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>flywheel</strong></td><td>FLY-wheel</td><td>飛輪效應</td><td>I have Flywheel for the hit.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I have Flywheel for the hit.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>knee-jerk</strong></td><td>knee-jerk</td><td>膝跳反射</td><td>Knee-jerk ready at gate.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Knee-jerk ready at gate.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>terror shock</strong></td><td>TER-ror shock</td><td>恐慌打擊</td><td>Do not get terror shocked on rescue.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Do not get terror shocked on rescue.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>bleed out</strong></td><td>bleed out</td><td>流血倒地計時</td><td>I am bleeding out — hurry.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I am bleeding out — hurry.\" data-lang=\"en-US\">🔊</button></td></tr></tbody></table><h4>殘局段落</h4><div class=\"para-block\"><div class=\"en\">Last cipher is done. I open the gate facing the boat. Watch for Detention. If the hunter camps the gate, bait the other side. Save Flywheel for the final hit. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Last cipher is done. I open the gate facing the boat. Watch for Detention. If the hunter camps the gate, bait the other side. Save Flywheel for the final hit.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh callout\">最後一機完成。我開船方向大門。小心門禁。如果監管守門，另一邊騙門。飛輪留畀最後一下。</div></div><div class=\"dialog\">\n<div class=\"line-item\"><div class=\"en\"><strong>A:</strong> Gate fifty percent. Hunter nearby! <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Gate fifty percent. Hunter nearby!\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">門五十，監管附近！</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>B:</strong> I will bait the back gate. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I will bait the back gate.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">我騙後門。</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>C:</strong> Detention flashed — go now! <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Detention flashed — go now!\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">門禁閃過——走！</div></div>\n</div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>跟讀殘局段落</li><li>對話角色輪換</li><li>40 秒殘局呼叫</li><li>默寫 6 殘局詞</li></ol><div class=\"timer-box\" data-work=\"40\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">殘局呼叫</button></div><div class=\"q-inline\" data-ans=\"1\"><strong>Detention 出現時？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">無腦撞門</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">等閃／騙門配合</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">全部上椅</button> <span class=\"q-fb\"></span></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. bait gate？</summary><p>騙門</p></details>\n<details><summary>Q2. terror shock？</summary><p>恐慌打擊</p></details>\n<details><summary>Q3. end game 重點？</summary><p>門＋門禁＋特質時機</p></details>\n</div>", "more": ["角色特質表可自擴", "唔保證術語官方唯一譯", "語音冷靜", "同複盤課合用", "收藏", "打卡", "文明", "重聽"]}, {"title": "【模仿者／Mimicry】模式總覽＋陣營詞庫", "mins": 15, "summary": "模仿者遊戲（Mimicry／Copycat）：社交推理。偵探團、模仿者、神秘客；會議同投票英文。", "goal": "分清 Mimicry ≠ Classic；背陣營同會議核心詞並朗讀。", "takeaway": "Mimicry＝任務＋線索＋會議投票；語音講證據唔好亂噴。", "concept": "<div class=\"callout\"><strong>Mode｜模式：</strong>模仿者模式 — Mimicry / Copycat mode（模仿者遊戲）</div><div class=\"concept\">\n<p>玩法偏向社交推理：完成任務、發現異常、召開緊急會議（emergency meeting）、討論並投票（vote／skip）。</p>\n<h4>陣營概念（入門）</h4>\n<p>Detective side（偵探團）、Copycat／Mimic side（模仿者）、Mystery Guest（神秘客）等——以遊戲內說明為準。</p>\n<h4>同 Classic 分別</h4>\n<p>無傳統 1v4 修機開門主目標；重點係身分推理同會議話術。</p>\n<h4>文明</h4>\n<p>指控要附理由；輸咗唔出人格侮辱。</p>\n</div>", "diagram": "<table class=\"vocab\"><thead><tr><th>單詞</th><th>提示</th><th>中文</th><th>例句</th><th></th></tr></thead><tbody><tr><td><strong>Mimicry mode</strong></td><td>MIM-ic-ry</td><td>模仿者模式</td><td>This lobby is Mimicry mode.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"This lobby is Mimicry mode.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>Copycat</strong></td><td>COP-y-cat</td><td>模仿者（模式／身分常用名）</td><td>I think they are the Copycat.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I think they are the Copycat.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>Detective</strong></td><td>de-TEC-tive</td><td>偵探（偵探團）</td><td>Detectives should finish tasks.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Detectives should finish tasks.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>Mystery Guest</strong></td><td>MYS-tery guest</td><td>神秘客</td><td>Mystery Guest win condition is different.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Mystery Guest win condition is different.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>task</strong></td><td>task</td><td>任務</td><td>I finished my tasks in the hallway.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I finished my tasks in the hallway.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>emergency meeting</strong></td><td>e-MER-gency meeting</td><td>緊急會議</td><td>I called an emergency meeting.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I called an emergency meeting.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>report</strong></td><td>re-PORT</td><td>報告屍體／異常</td><td>I reported a body near storage.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I reported a body near storage.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>vote</strong></td><td>vote</td><td>投票</td><td>Vote carefully after discussion.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Vote carefully after discussion.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>skip</strong></td><td>skip</td><td>跳過／棄票</td><td>I skip — not enough proof.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I skip — not enough proof.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>suspect</strong></td><td>sus-PECT</td><td>懷疑對象</td><td>You are my top suspect.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"You are my top suspect.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>alibi</strong></td><td>AL-i-bi</td><td>不在場／行動解釋</td><td>What is your alibi this round?</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"What is your alibi this round?\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>eject</strong></td><td>e-JECT</td><td>票出／放逐</td><td>We ejected the wrong person.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"We ejected the wrong person.\" data-lang=\"en-US\">🔊</button></td></tr></tbody></table><h4>開局說明段落</h4><div class=\"para-block\"><div class=\"en\">Friends, we are in Mimicry mode, not Classic. Please finish tasks, watch for strange behavior, and save your accusations for the meeting. If you report, say where and what you saw. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Friends, we are in Mimicry mode, not Classic. Please finish tasks, watch for strange behavior, and save your accusations for the meeting. If you report, say where and what you saw.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh callout\">朋友，我哋而家係模仿者模式，唔係傳統模式。請做任務、觀察異常，指控留待會議。如果你報告，講清楚地點同你見到咩。</div></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>對照 Classic 寫兩句分別</li><li>跟讀 12 詞</li><li>朗讀開局段落</li><li>模擬 30 秒會議開場</li></ol><div class=\"timer-box\" data-work=\"30\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">會議開場</button></div><div class=\"blank\">分別：…</div><div class=\"q-inline\" data-ans=\"1\"><strong>Mimicry 核心？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">只修密碼機</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">任務＋會議推理</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">飛輪騙門</button> <span class=\"q-fb\"></span></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. emergency meeting？</summary><p>緊急會議</p></details>\n<details><summary>Q2. alibi？</summary><p>行動解釋／不在場說法</p></details>\n<details><summary>Q3. 同 Classic？</summary><p>唔同主目標</p></details>\n<details><summary>Q4. skip？</summary><p>棄票／跳過</p></details>\n</div>", "more": ["以遊戲內最新身分說明為準", "12 人場次身分更多", "唔劇透朋友真實策略到煩", "同媒體素養：防帶風向", "收藏", "打卡", "文明", "重聽"]}, {"title": "【模仿者／Mimicry】會議討論句庫", "mins": 15, "summary": "會議：提問、指控、辯護、求證據、冷卻情緒；大量對話可聽讀。", "goal": "能進行一輪 8 句會議對話；寫自己嘅「證據句型」。", "takeaway": "先觀察→再問題→後結論；避免無證據帶節奏。", "concept": "<div class=\"callout\"><strong>Mode｜模式：</strong>模仿者模式 — Mimicry</div><div class=\"concept\">\n<p>句型：I saw… / Where were you… / That does not add up… / Soft sus vs hard claim。</p>\n</div>", "diagram": "<table class=\"vocab\"><thead><tr><th>單詞</th><th>提示</th><th>中文</th><th>例句</th><th></th></tr></thead><tbody><tr><td><strong>I saw</strong></td><td>I saw</td><td>我見到</td><td>I saw you leave the room alone.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I saw you leave the room alone.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>where were you</strong></td><td>where were you</td><td>你喺邊</td><td>Where were you when the body was reported?</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Where were you when the body was reported?\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>does not add up</strong></td><td>does not add up</td><td>不合邏輯</td><td>Your story does not add up.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Your story does not add up.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>soft sus</strong></td><td>soft sus</td><td>輕微懷疑</td><td>Soft sus on blue, not a hard claim.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Soft sus on blue, not a hard claim.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>hard claim</strong></td><td>hard claim</td><td>強硬斷言</td><td>Do not hard claim without proof.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Do not hard claim without proof.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>proof</strong></td><td>proof</td><td>證據</td><td>Do we have proof or only feelings?</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Do we have proof or only feelings?\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>contradict</strong></td><td>con-tra-DICT</td><td>矛盾</td><td>They contradicted their earlier alibi.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"They contradicted their earlier alibi.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>quiet</strong></td><td>qui-et</td><td>好靜／少發言</td><td>You were too quiet this meeting.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"You were too quiet this meeting.\" data-lang=\"en-US\">🔊</button></td></tr></tbody></table><div class=\"dialog\">\n<div class=\"line-item\"><div class=\"en\"><strong>You:</strong> I called the meeting because I found a body in the hallway. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I called the meeting because I found a body in the hallway.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">我開會因為走廊發現異常／屍體報告。</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>Mate:</strong> I was doing tasks in the kitchen. Anyone see me? <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I was doing tasks in the kitchen. Anyone see me?\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">我喺廚房做任務，有無目擊？</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>You:</strong> I did not see you. Please give a clear route. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I did not see you. Please give a clear route.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">我冇見你，請講清楚路線。</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>Mate:</strong> Okay: kitchen, then storage, then here. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Okay: kitchen, then storage, then here.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">好：廚房→倉庫→呢度。</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>You:</strong> If no proof, I may skip this round. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"If no proof, I may skip this round.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">無證據我可能 skip。</div></div>\n</div><h4>主持會議段落</h4><div class=\"para-block\"><div class=\"en\">Let us slow down. Accusations need reasons. Tell us your path this round, who you walked with, and which tasks you finished. If stories contradict, we vote; if not, we skip and gather more info. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Let us slow down. Accusations need reasons. Tell us your path this round, who you walked with, and which tasks you finished. If stories contradict, we vote; if not, we skip and gather more info.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh callout\">我哋慢啲。指控要有理由。講呢輪路線、同邊個一齊、做完邊啲任務。如果口供矛盾就投票；如果唔係，就 skip 再收集資訊。</div></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>角色扮演對話兩輪</li><li>用 🔊 錄自辯 40 秒</li><li>寫 3 條證據句型</li><li>把「感受」改成「觀察」一句</li></ol><div class=\"timer-box\" data-work=\"40\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">自辯 40 秒</button></div><div class=\"blank\">句型：1…2…3…</div><div class=\"q-inline\" data-ans=\"1\"><strong>hard claim 應？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">無證據都喊</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">有proof先</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">一定要鬧人</button> <span class=\"q-fb\"></span></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. soft sus？</summary><p>輕懷疑</p></details>\n<details><summary>Q2. 會議態度？</summary><p>要理由</p></details>\n<details><summary>Q3. contradict？</summary><p>矛盾</p></details>\n</div>", "more": ["練習轉述他人觀點", "唔人身攻擊", "可學英語會議連接詞", "同 think 課論證合用", "收藏", "打卡", "情緒冷靜", "重聽"]}, {"title": "【模仿者／Mimicry】任務、報告同地圖呼叫", "mins": 14, "summary": "做任務、目擊、報告位置、叫人組隊同行；英漢段落。", "goal": "報 6 個位置句；完成任務進度對話。", "takeaway": "報告＝地點＋時間／輪次＋你做緊咩。", "concept": "<div class=\"callout\"><strong>Mode｜模式：</strong>模仿者模式 — Mimicry</div><div class=\"concept\">\n<p>task call 同 Classic cipher call 唔同：講 task 名稱／區域，唔係 percent 修機。</p>\n</div>", "diagram": "<table class=\"vocab\"><thead><tr><th>單詞</th><th>提示</th><th>中文</th><th>例句</th><th></th></tr></thead><tbody><tr><td><strong>hallway</strong></td><td>HALL-way</td><td>走廊</td><td>Body reported in the hallway.</td><td><button type=\"button\" class= details><summary>Q1. group up？</summary><p>組隊</p></details>\n<details><summary>Q2. alone 風險？</summary><p>易被質疑／危險視角</p></details>\n<details><summary>Q3. round？</summary><p>輪次</p></details>\n</div>", "more": ["用地圖實際英文名替換", "觀察誰跟誰", "唔造假證", "文明", "收藏", "打卡", "可加口音練習", "重聽"]}, {"title": "【模仿者／Mimicry】投票、跳過同賽後英文", "mins": 14, "summary": "vote／skip／eject 話術；輸贏複盤禮貌句；防帶風向。", "goal": "完成投票回合對話；寫 4 句賽後英文。", "takeaway": "投票講理由；賽後可複盤但唔私訊騷擾。", "concept": "<div class=\"callout\"><strong>Mode｜模式：</strong>模仿者模式 — Mimicry</div><div class=\"concept\">\n<p>vote 要短講 why；skip 係資訊不足時合理選項；eject 錯唔等於下一句侮辱。</p>\n</div>", "diagram": "<table class=\"vocab\"><thead><tr><th>單詞</th><th>提示</th><th>中文</th><th>例句</th><th></th></tr></thead><tbody><tr><td><strong>I vote</strong></td><td>I vote</td><td>我投</td><td>I vote red — story changed twice.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I vote red — story changed twice.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>I skip</strong></td><td>I skip</td><td>我棄票</td><td>I skip; we need more info.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I skip; we need more info.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>ejected</strong></td><td>e-JECT-ed</td><td>被票出</td><td>We ejected a Detective by mistake.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"We ejected a Detective by mistake.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>gg</strong></td><td>gg</td><td>打得好</td><td>GG, well played meeting calls.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"GG, well played meeting calls.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>next time</strong></td><td>next time</td><td>下次</td><td>Next time I will track alibis better.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Next time I will track alibis better.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>no hard feelings</strong></td><td>no hard feelings</td><td>唔好介意</td><td>No hard feelings after the vote.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"No hard feelings after the vote.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>throw</strong></td><td>throw</td><td>故意送／攪局</td><td>Please do not throw the match.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Please do not throw the match.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>toxic</strong></td><td>TOX-ic</td><td>有毒言行</td><td>Let us avoid toxic chat.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Let us avoid toxic chat.\" data-lang=\"en-US\">🔊</button></td></tr></tbody></table><div class=\"dialog\">\n<div class=\"line-item\"><div class=\"en\"><strong>A:</strong> I vote blue. Alibi contradicted. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I vote blue. Alibi contradicted.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">我投藍，口供矛盾。</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>B:</strong> I skip. Not enough proof. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I skip. Not enough proof.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">我 skip，證據唔夠。</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>C:</strong> Okay, majority on blue. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Okay, majority on blue.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">好，多數向藍。</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>A:</strong> GG. Close game. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"GG. Close game.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">GG，好接近。</div></div>\n</div><h4>賽後段落</h4><div class=\"para-block\"><div class=\"en\">After the match, review calmly: which claim had proof, which vote was early, and what task route was smart. Do not harass players in private messages. Mute if chat becomes toxic. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"After the match, review calmly: which claim had proof, which vote was early, and what task route was smart. Do not harass players in private messages. Mute if chat becomes toxic.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh callout\">賽後冷靜複盤：邊個指控有證據、邊次投票太早、邊條任務路線明智。唔好私訊騷擾。聊天有毒就 mute。</div></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>跟讀投票對話</li><li>寫自己 vote why 模板</li><li>朗讀賽後段落</li><li>列 2 個 mute 情境</li></ol><div class=\"timer-box\" data-work=\"35\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">投票理由 35 秒</button></div><div class=\"blank\">模板：I vote ___ because ___.</div><div class=\"q-inline\" data-ans=\"1\"><strong>證據不足時？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">必須硬投</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">可以 skip</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">一定要鬧</button> <span class=\"q-fb\"></span></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. gg？</summary><p>打得好</p></details>\n<details><summary>Q2. toxic？</summary><p>有毒言行</p></details>\n<details><summary>Q3. 錯票後？</summary><p>可複盤但唔騷擾</p></details>\n</div>", "more": ["同 Classic 賽後課對照", "舉報遊戲內騷擾途徑", "英文溫柔但清晰", "收藏", "打卡", "禮貌優先", "重聽", "完"]}, {"title": "【雙模式】Classic vs Mimicry 對照＋綜合聽讀", "mins": 15, "summary": "同一批玩家切換模式時點講；對照表；兩段長文聽讀；綜合自測。", "goal": "一分鐘講清兩模式分別；通過綜合題。", "takeaway": "開麥先講 mode；詞庫唔好混用錯情境。", "concept": "<div class=\"callout\"><strong>Mode｜模式：</strong>雙模式 — Classic ↔ Mimicry</div><div class=\"concept\">\n<p>開局第一句建議：We are on Classic. 或 We are on Mimicry.</p>\n<h4>易混</h4>\n<p>喺 Mimicry 喊 kite the hunter／喺 Classic 喊 vote them out——會笑同會亂。</p>\n<h4>練習</h4>\n<p>左右欄對照跟讀。</p>\n</div>", "diagram": "<div class=\"filled\"><strong>Classic：</strong> hunter / survivor / cipher / kite / rescue / gate<br><strong>Mimicry：</strong> Copycat / Detective / task / meeting / vote / alibi</div><table class=\"vocab\"><thead><tr><th>單詞</th><th>提示</th><th>中文</th><th>例句</th><th></th></tr></thead><tbody><tr><td><strong>mode</strong></td><td>mode</td><td>模式</td><td>Confirm the mode before we queue chat.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Confirm the mode before we queue chat.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>lobby</strong></td><td>LOB-by</td><td>房間／大廳</td><td>Wrong mode — remake the lobby.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Wrong mode — remake the lobby.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>remake</strong></td><td>re-MAKE</td><td>重開</td><td>Remake if someone queued the wrong mode.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Remake if someone queued the wrong mode.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>callout</strong></td><td>CALL-out</td><td>呼叫用語</td><td>Use mode-correct callouts.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Use mode-correct callouts.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>queue</strong></td><td>queue</td><td>排隊入局</td><td>I queued Mimicry by mistake.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I queued Mimicry by mistake.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>switch</strong></td><td>switch</td><td>切換</td><td>Switch your callouts when the mode changes.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Switch your callouts when the mode changes.\" data-lang=\"en-US\">🔊</button></td></tr></tbody></table><h4>對照段落</h4><div class=\"para-block\"><div class=\"en\">If we play Classic, call ciphers, kites, and rescues. If we play Mimicry, call tasks, meetings, and votes. Do not mix the dictionaries. Ask once at the start: Which mode is this? <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"If we play Classic, call ciphers, kites, and rescues. If we play Mimicry, call tasks, meetings, and votes. Do not mix the dictionaries. Ask once at the start: Which mode is this?\" data-lang=\"en-US\">🔊</button></div><div class=\"zh callout\">如果玩傳統，就報機、牽制、救援。如果玩模仿者，就報任務、會議、投票。唔好把兩套詞庫撈亂。開局問一次：而家邊個模式？</div></div><h4>並排示例</h4><div class=\"para-block\"><div class=\"en\">Sample Classic: Cipher seventy, I kite mid, need rescue later. Sample Mimicry: I finished hallway tasks, soft sus on the player who was always alone, I may skip without proof. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Sample Classic: Cipher seventy, I kite mid, need rescue later. Sample Mimicry: I finished hallway tasks, soft sus on the player who was always alone, I may skip without proof.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh callout\">傳統示例：機七十％，我拖中間，稍後可能要救。模仿者示例：走廊任務完成，對成日獨行嗰位 soft sus，無證據可能 skip。</div></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>抽籤講 Classic 5 句</li><li>抽籤講 Mimicry 5 句</li><li>60 秒對照演說</li><li>改錯：把混用句改正</li></ol><div class=\"timer-box\" data-work=\"60\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">對照演說</button></div><div class=\"blank\">改錯：1…2…</div><div class=\"q-inline\" data-ans=\"1\"><strong>Mimicry 應優先喊？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">open the gate</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">emergency meeting／vote reasons</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">Detention</button> <span class=\"q-fb\"></span></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 開局先講？</summary><p>mode</p></details>\n<details><summary>Q2. remake？</summary><p>重開房間</p></details>\n<details><summary>Q3. 混詞庫？</summary><p>唔好</p></details>\n<details><summary>Q4. soft sus 屬邊邊？</summary><p>Mimicry 會議</p></details>\n</div>", "more": ["把本課加收藏", "同舊 IDV 課一齊複習", "語音房規範", "雙模式詞卡可手寫", "統計導出", "文明", "重聽兩段", "完結"]}, {"title": "【雙模式】角色報點、邀請組隊同語音禮儀", "mins": 14, "summary": "組隊邀請、報角色／身分、麥序禮儀；Classic 報求生監管，Mimicry 報是否方便開麥推理。", "goal": "寫兩段組隊邀請（各模式）；完成禮儀自測。", "takeaway": "邀請講 mode＋語言＋麥；遊戲中輪流講清楚。", "concept": "<div class=\"callout\"><strong>Mode｜模式：</strong>雙模式 — Party invite + voice etiquette</div><div class=\"concept\">\n<p>邀請公式：mode + rank/fun + mic + language。</p>\n<h4>禮儀</h4>\n<p>唔搶麥、唔罵戰、聽完再反駁。</p>\n</div>", "diagram": "<table class=\"vocab\"><thead><tr><th>單詞</th><th>提示</th><th>中文</th><th>例句</th><th></th></tr></thead><tbody><tr><td><strong>invite</strong></td><td>in-VITE</td><td>邀請</td><td>Can I invite you to Mimicry?</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Can I invite you to Mimicry?\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>mic on</strong></td><td>mic on</td><td>開麥</td><td>Mic on if you can talk.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Mic on if you can talk.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>push to talk</strong></td><td>push to talk</td><td>按鍵說話</td><td>Use push to talk please.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Use push to talk please.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>main</strong></td><td>main</td><td>主玩</td><td>I main survivor in Classic.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I main survivor in Classic.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>flex</strong></td><td>flex</td><td>可多位置</td><td>I can flex hunter or survivor.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"I can flex hunter or survivor.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>chill lobby</strong></td><td>chill lobby</td><td>輕鬆房</td><td>Chill lobby — no toxic calls.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Chill lobby — no toxic calls.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>serious ranked</strong></td><td>SE-ri-ous ranked</td><td>認真排位</td><td>Serious ranked Classic tonight.</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Serious ranked Classic tonight.\" data-lang=\"en-US\">🔊</button></td></tr><tr><td><strong>role</strong></td><td>role</td><td>角色／身分</td><td>What role are you comfortable claiming?</td><td><button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"What role are you comfortable claiming?\" data-lang=\"en-US\">🔊</button></td></tr></tbody></table><div class=\"line-item\"><div class=\"en\">Invite: Classic ranked, mic on, English or Cantonese OK. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Invite: Classic ranked, mic on, English or Cantonese OK.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">邀請：傳統排位，開麥，英／粵都得。</div></div><div class=\"line-item\"><div class=\"en\">Invite: Mimicry fun lobby, need people who discuss politely. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Invite: Mimicry fun lobby, need people who discuss politely.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">邀請：模仿者娛樂房，要肯禮貌討論。</div></div><h4>禮儀段落</h4><div class=\"para-block\"><div class=\"en\">In Classic, tell us your character and whether you prefer kite or decode. In Mimicry, tell us if you can speak in meetings and stay calm when accused. Either mode: no insults, no spam. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"In Classic, tell us your character and whether you prefer kite or decode. In Mimicry, tell us if you can speak in meetings and stay calm when accused. Either mode: no insults, no spam.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh callout\">傳統模式請講角色、偏牽制定修機。模仿者模式請講可不可以會議發言、被指控時可唔可以冷靜。無論邊個模式：唔辱罵、唔洗頻。</div></div><div class=\"dialog\">\n<div class=\"line-item\"><div class=\"en\"><strong>You:</strong> Want Classic or Mimicry tonight? <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Want Classic or Mimicry tonight?\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">今晚傳統定模仿者？</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>Friend:</strong> Mimicry, chill lobby. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Mimicry, chill lobby.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">模仿者，輕鬆房。</div></div>\n<div class=\"line-item\"><div class=\"en\"><strong>You:</strong> Okay, mic on, no toxic. Inviting. <button type=\"button\" class=\"sm\" data-act=\"speak\" data-en=\"Okay, mic on, no toxic. Inviting.\" data-lang=\"en-US\">🔊</button></div><div class=\"zh\">好，開麥、唔毒。邀請緊。</div></div>\n</div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>寫兩段邀請</li><li>跟讀對話</li><li>自訂 push-to-talk 提醒句</li><li>列 3 條房規英文</li></ol><div class=\"timer-box\" data-work=\"40\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">邀請演練</button></div><div class=\"blank\">房規：1…2…3…</div><div class=\"q-inline\" data-ans=\"1\"><strong>被指控時？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刻對罵</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">冷靜解釋 alibi</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">退出辱罵</button> <span class=\"q-fb\"></span></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. flex？</summary><p>可多位置</p></details>\n<details><summary>Q2. chill lobby？</summary><p>輕鬆房</p></details>\n<details><summary>Q3. 邀請要講？</summary><p>mode＋麥＋氛圍</p></details>\n</div>", "more": ["可加 Discord 用語但唔強制", "保護私隱", "唔強求開麥", "收藏邀請模板", "打卡", "同組隊舊課合用", "文明", "完"]}], "think": [{"title": "結論先行：結論→理由→下一步", "mins": 12, "summary": "會議同訊息用三拍講清楚；含範本、計時講練、中英朗讀。", "goal": "寫出／講出完整三拍；45 秒口頭版；分辨結論同背景。", "takeaway": "第一句放結論或請求；理由要具體；最後係可執行下一步。", "concept": "<div class=\"concept\">\n<p>把答案或請求放第一句（BLUF），之後先 suppl 理由。</p>\n<p>（三拍）①結論 ②理由1–2 ③下一步（時間＋動作＋人）
