<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f7f4ef"/>
<title>Daily Task</title>
<style>
:root{
  --bg:#f7f4ef;--bg2:#efeae2;--paper:#fffcf8;--ink:#1c1917;--muted:#78716c;
  --line:#e7e0d5;--accent:#0f766e;--accent2:#b45309;--rose:#be123c;--sky:#0369a1;
  --qin:#0f766e;--qi:#7c3aed;--shu:#b45309;--hua:#0369a1;--fit:#be123c;--speak:#2563eb;--think:#c2410c;--xuan:#6d28d9;--memory:#0891b2;--tcm:#7c3aed;--care:#db2777;--yijing:#b45309;
  --radius:20px;--shadow:0 10px 40px rgba(28,25,23,.06);
  --font:"Segoe UI","PingFang HK","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12110f;--bg2:#1a1814;--paper:#1e1c18;--ink:#f5f2eb;--muted:#a8a29e;
    --line:#2e2a24;--shadow:0 12px 40px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(900px 420px at 0% -5%,rgba(15,118,110,.12),transparent 55%),
  radial-gradient(800px 400px at 100% 0%,rgba(180,83,9,.1),transparent 50%),
  var(--bg)}
.app{max-width:880px;margin:0 auto;padding:28px 20px 120px}
.hero{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.hero-left{flex:1;min-width:240px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px}
h1{margin:0 0 8px;font-size:clamp(1.85rem,5vw,2.55rem);font-weight:750;letter-spacing:-.02em;line-height:1.15}
.lead{margin:0;color:var(--muted);font-size:1.02rem;line-height:1.55;max-width:36em}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{padding:8px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:.82rem;color:var(--muted);box-shadow:var(--shadow)}
.chip strong{color:var(--ink);font-weight:700}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:11px 16px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);transition:transform .12s,background .12s,border-color .12s}
button:hover{transform:translateY(-1px);border-color:#c4b8a5}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:700}
button.ghost{background:transparent;box-shadow:none;color:var(--muted)}
button.sm{padding:8px 12px;font-size:.82rem;border-radius:12px}
button.fav.on{border-color:#d97706;color:#b45309;background:#fff7ed}
button.done.on{border-color:#0d9488;color:#0f766e;background:#f0fdfa}
button.icon-toggle{min-width:44px}
.tabs{display:flex;gap:6px;padding:6px;background:var(--bg2);border-radius:16px;margin-bottom:14px;border:1px solid var(--line)}
.tab{flex:1;text-align:center;padding:12px 10px;border:none;border-radius:12px;background:transparent;box-shadow:none;color:var(--muted);font-weight:650;font-size:.92rem}
.tab.active{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.panel{display:none}.panel.active{display:block}
.section-label{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:4px 0 10px}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 10px;margin:0 0 6px;scrollbar-width:thin}
.cat-tabs button{flex:0 0 auto;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:.88rem;box-shadow:none}
.cat-tabs button.active{color:#fff;border-color:transparent}
.cat-tabs button[data-cat="qin"].active{background:var(--qin)}
.cat-tabs button[data-cat="qi"].active{background:var(--qi)}
.cat-tabs button[data-cat="shu"].active{background:var(--shu)}
.cat-tabs button[data-cat="hua"].active{background:var(--hua)}
.cat-tabs button[data-cat="fit"].active{background:var(--fit)}
.cat-tabs button[data-cat="speak"].active{background:var(--speak)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pager .info{font-size:.82rem;color:var(--muted);text-align:center;flex:1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);animation:cardIn .35s ease}
.card.done{opacity:.92;border-color:rgba(15,118,110,.35)}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cover{height:140px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cover svg{width:100%;height:100%;display:block}
.cover .badge{position:absolute;left:14px;top:14px;padding:5px 10px;border-radius:999px;background:rgba(255,252,248,.92);backdrop-filter:blur(8px);font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--ink)}
.body{padding:16px 18px 20px}
.kicker{font-size:.78rem;font-weight:800;letter-spacing:.08em;margin-bottom:6px}
.kicker.qin{color:var(--qin)}.kicker.qi{color:var(--qi)}.kicker.shu{color:var(--shu)}
.kicker.hua{color:var(--hua)}.kicker.fit{color:var(--fit)}.kicker.speak{color:var(--speak)}
.card h2{margin:0 0 6px;font-size:1.22rem;font-weight:750;letter-spacing:-.01em;line-height:1.3}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;color:var(--muted);font-size:.82rem}
.pill{padding:3px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:.72rem}
.summary{color:var(--muted);font-size:.95rem;line-height:1.55;margin:0 0 10px}
.sec-nav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0 10px;margin:0 0 8px;border-bottom:1px solid var(--line)}
.sec-nav button{padding:6px 10px;border-radius:999px;font-size:.75rem;font-weight:700;box-shadow:none;background:var(--bg2);color:var(--muted)}
.sec-nav button.active{background:var(--ink);color:var(--bg);border-color:transparent}
.sec{display:none}
.sec.open{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:.35}to{opacity:1}}
.callout{border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;background:var(--bg);border-radius:0 10px 10px 0;font-size:.92rem;line-height:1.55}
.lesson-block{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
.lesson-block h3{margin:0 0 10px;font-size:.92rem;font-weight:750}
.steps{margin:0;padding-left:1.15em;line-height:1.55;font-size:.92rem}
.steps li{margin:6px 0}
.line-item{padding:10px 0;border-bottom:1px dashed var(--line)}
.line-item:last-child{border-bottom:none}
.line-item .en{font-weight:750;font-size:1.05rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.line-item .zh{color:var(--muted);font-size:.88rem;margin-top:3px}
.line-item .tip{color:var(--speak);font-size:.78rem;margin-top:4px}
.ex-row{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ex-row:last-child{border-bottom:none}
.ex-row .name{font-weight:750}
.ex-row .how{color:var(--muted);font-size:.88rem;line-height:1.45;margin-top:2px}
.more{display:none;margin-top:12px;padding:14px;border-radius:14px;background:linear-gradient(180deg,rgba(15,118,110,.06),transparent),var(--bg);border:1px solid var(--line)}
.more.open{display:block;animation:fade .2s ease}
.more h4{margin:0 0 8px;font-size:.88rem}
.more ul{margin:0;padding-left:1.15em;font-size:.88rem;line-height:1.5;color:var(--muted)}
.more li{margin:5px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.empty{text-align:center;padding:48px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:var(--paper)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:.88rem;font-weight:650;transition:.25s;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.list-item{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.list-item input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.list-item .t{font-weight:700}.list-item .d{color:var(--muted);font-size:.85rem;margin-top:2px}
.footer-note{margin-top:28px;text-align:center;color:var(--muted);font-size:.78rem}
.fav-row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%}
.fav-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.fav-row .t{font-weight:750;font-size:.95rem}.fav-row .d{color:var(--muted);font-size:.78rem;margin-top:2px}
.quiz details{margin:8px 0;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:.9rem}
.quiz summary{font-weight:700;cursor:pointer}
.q-inline{margin:10px 0;padding:10px;background:var(--bg);border-radius:12px;border:1px solid var(--line)}
.q-inline .q-fb{display:inline-block;margin-left:8px;font-size:.82rem;font-weight:700}
.q-inline .q-fb.ok{color:#0f766e}.q-inline .q-fb.bad{color:#be123c}
.filled{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:.9rem;line-height:1.55;white-space:pre-wrap}
.blank{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;min-height:72px;color:var(--muted);font-size:.88rem;white-space:pre-wrap}
.concept p{margin:0 0 10px;font-size:.92rem;line-height:1.6}
.concept h4{margin:12px 0 6px;font-size:.88rem}
.safety{font-size:.8rem;color:var(--muted);margin-top:8px}
.timer-box{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:10px;background:var(--paper);border:1px dashed var(--line);border-radius:12px}
.timer-display{font-variant-numeric:tabular-nums;font-weight:750;min-width:4ch}
.rhythm-box{margin-top:10px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.rhythm-box .beat{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 4px;transition:background .1s,transform .1s}
.rhythm-box .beat.on{background:var(--qin);transform:scale(1.25)}
.mini-dialogue{margin-top:10px;padding:12px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;font-size:.9rem;line-height:1.55}
.confetti-piece{position:fixed;width:8px;height:8px;border-radius:2px;z-index:60;pointer-events:none;animation:confettiFall 1s ease-out forwards}
@keyframes confettiFall{to{transform:translateY(100vh) rotate(400deg);opacity:0}}
.note-float{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pulse-dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.fit-bounce{animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bubble-pop{animation:pop 2.5s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.heart-pop{animation:heart .45s ease}
@keyframes heart{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.progress-pulse{animation:pp 1s ease}
@keyframes pp{0%{box-shadow:0 0 0 0 rgba(15,118,110,.4)}100%{box-shadow:0 0 0 12px transparent}}
@media (max-width:560px){
  .app{padding:18px 14px 110px}
  .cover{height:112px}
  .card h2{font-size:1.08rem}
  .ex-row{grid-template-columns:56px 1fr}
  .cat-tabs button{padding:8px 12px;font-size:.8rem}
}
@media (prefers-reduced-motion: reduce){
  .card,.sec,.more,.note-float,.pulse-dot,.fit-bounce,.bubble-pop{animation:none!important}
}

.kicker.think{color:var(--think)}.kicker.xuan{color:var(--xuan)}
.think{color:var(--think)}.xuan{color:var(--xuan)}
.cat-tabs button[data-cat="think"].active{background:var(--think)}
.cat-tabs button[data-cat="xuan"].active{background:var(--xuan)}
.vocab{width:100%;border-collapse:collapse;font-size:.82rem;margin:8px 0;background:var(--bg);border-radius:12px;overflow:hidden}
.vocab th,.vocab td{border:1px solid var(--line);padding:8px;vertical-align:top}
.vocab th{background:var(--bg2);text-align:left}
.para-block{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:linear-gradient(180deg,rgba(37,99,235,.06),transparent)}
.para-block .en{font-weight:700;line-height:1.5}
.tap-board{margin:8px 0}.tap-zones{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tap-zone{background:#f5f3ff;border-color:#c4b5fd}
.tap-out{min-height:48px}
.safety-xuan{border-left-color:#7c3aed;background:#faf5ff}
.ear-box{padding:12px;border:1px dashed var(--qin);border-radius:12px;margin:8px 0;background:#f0fdfa}
.ear-box button{margin:4px 4px 4px 0}
.anim-svg .note-pulse{animation:pulseN 1.2s ease-in-out infinite}
.anim-svg .note-pulse.dly{animation-delay:.2s}.anim-svg .note-pulse.dly2{animation-delay:.4s}
@keyframes pulseN{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.75}}
.anim-svg .box-pop{animation:popB 2s ease-in-out infinite}
.anim-svg .box-pop.dly{animation-delay:.3s}.anim-svg .box-pop.dly2{animation-delay:.6s}
@keyframes popB{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.spin-slow{animation:spinS 16s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spinS{to{transform:rotate(360deg)}}
.blink{animation:blink 3s infinite}
@keyframes blink{0%,45%,55%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
.cell-glow{animation:glowC 2.5s ease-in-out infinite}
@keyframes glowC{0%,100%{fill:#ede9fe}50%{fill:#ddd6fe}}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat-card .n{font-size:1.4rem;font-weight:800}
.stat-card .l{font-size:.78rem;color:var(--muted)}
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.syllabus details{margin:6px 0;padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.export-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
@media (prefers-reduced-motion:reduce){.anim-svg .note-pulse,.anim-svg .box-pop,.spin-slow,.blink,.cell-glow{animation:none!important}}


.kicker.memory{color:var(--memory)}.kicker.tcm{color:var(--tcm)}.kicker.care{color:var(--care)}
.memory{color:var(--memory)}.tcm{color:var(--tcm)}.care{color:var(--care)}
.cat-tabs button[data-cat="memory"].active{background:var(--memory)}
.cat-tabs button[data-cat="tcm"].active{background:var(--tcm)}
.cat-tabs button[data-cat="care"].active{background:var(--care)}
.route-draw{animation:dashMove 2.5s linear infinite}
@keyframes dashMove{to{stroke-dashoffset:-28}}


.kicker.yijing{color:var(--yijing)}.yijing{color:var(--yijing)}
.cat-tabs button[data-cat="yijing"].active{background:var(--yijing)}


.dialog{display:flex;flex-direction:column;gap:.55rem;margin:.5rem 0}
.para-block{background:var(--card,#fff);border:1px solid #e5e7eb;border-radius:12px;padding:.75rem .9rem;margin:.6rem 0}
.para-block .en{font-size:1.02rem;line-height:1.55;margin-bottom:.45rem}
.para-block .zh{margin:0}
.clip-pop{position:fixed;z-index:9999;transform:translate(-50%,-120%);background:#0f172a;color:#fff;border-radius:999px;padding:.35rem .75rem;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.85rem;display:flex;gap:.4rem;align-items:center}
.clip-pop button{border:0;background:#fbbf24;color:#111;border-radius:999px;padding:.25rem .65rem;font-weight:600;cursor:pointer}
.clip-pop[hidden]{display:none!important}
.clip-card{border:1px solid #e5e7eb;border-radius:14px;padding:.85rem 1rem;margin:.55rem 0;background:#fffdf8}
.clip-card .clip-text{font-size:1rem;line-height:1.5;white-space:pre-wrap;margin:.25rem 0 .5rem}
.clip-card .meta{font-size:.78rem;color:#64748b}
.clip-card textarea{width:100%;min-height:58px;border-radius:10px;border:1px solid #e2e8f0;padding:.45rem .6rem;margin-top:.4rem;font:inherit}
.clip-card .clip-actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.45rem}
::selection{background:#fde68a;color:#111}
.lesson-selecting ::selection{background:#fbbf24}


/* —— 可可愛愛小卡通 mascots —— */
.mascot{display:inline-block;vertical-align:middle;user-select:none;pointer-events:none}
.mascot svg{display:block;overflow:visible}
.mascot-bounce{animation:mascotBounce 2.4s ease-in-out infinite}
.mascot-float{animation:mascotFloat 3.2s ease-in-out infinite}
@keyframes mascotBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}60%{transform:translateY(-3px)}}
@keyframes mascotFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.mascot .eye{transform-box:fill-box;transform-origin:center;animation:mascotBlink 4.5s infinite}
.mascot .eye.r{animation-delay:.08s}
@keyframes mascotBlink{0%,42%,48%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}
.mascot .cheek{opacity:.9}
.mascot-hero{width:112px;height:112px;flex-shrink:0;filter:drop-shadow(0 8px 14px rgba(15,23,42,.12))}
.hero{align-items:center}
.hero-buddy{display:flex;align-items:center;gap:14px}
.cover{position:relative}
.mascot-cover{position:absolute;right:10px;bottom:6px;width:72px;height:72px;z-index:2;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.mascot-empty{width:88px;height:88px;margin:0 auto 10px;display:block}
.empty.with-mascot{text-align:center;padding:1.2rem .75rem}
.mascot-celeb{position:fixed;right:18px;bottom:18px;width:120px;height:120px;z-index:70;pointer-events:none;animation:mascotCeleb 1.35s ease-out forwards;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
@keyframes mascotCeleb{0%{transform:translateY(40px) scale(.6) rotate(-8deg);opacity:0}25%{opacity:1;transform:translateY(-8px) scale(1.08) rotate(4deg)}70%{transform:translateY(0) scale(1) rotate(0)}100%{opacity:0;transform:translateY(-20px) scale(.95)}}
.mascot .spark{animation:sparkPop 1.2s ease-in-out infinite}
@keyframes sparkPop{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="hero-buddy">
      <div class="mascot mascot-hero mascot-bounce" aria-hidden="true" title="Daily Task 小狐">
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="60" cy="108" rx="28" ry="6" fill="#cbd5e1" opacity=".45"/>
  <ellipse cx="60" cy="78" rx="26" ry="22" fill="#fdba74"/>
  <circle cx="60" cy="52" r="32" fill="#fb923c"/>
  <path d="M32 38 L22 12 L48 30 Z" fill="#fb923c"/><path d="M88 38 L98 12 L72 30 Z" fill="#fb923c"/>
  <path d="M34 34 L26 16 L46 30 Z" fill="#ffedd5"/><path d="M86 34 L94 16 L74 30 Z" fill="#ffedd5"/>
  <ellipse cx="48" cy="54" rx="7" ry="8" fill="#fff"/><ellipse cx="72" cy="54" rx="7" ry="8" fill="#fff"/>
  <ellipse class="eye" cx="49" cy="55" rx="3.2" ry="4" fill="#0f172a"/><ellipse class="eye r" cx="73" cy="55" rx="3.2" ry="4" fill="#0f172a"/>
  <circle cx="50.2" cy="53.5" r="1.1" fill="#fff"/><circle cx="74.2" cy="53.5" r="1.1" fill="#fff"/>

/* Original chibi mascots — not based on copyrighted characters */
function mascotSVG(kind, opts){
  opts=opts||{};
  const w=opts.size||120;
  const label=opts.label||'';
  const P={
    fox:{body:'#fb923c',belly:'#ffedd5',ear:'#fb923c',earIn:'#ffedd5',nose:'#9a3412',accent:'#fdba74'},

    panda:{body:'#f8fafc',belly:'#fff',ear:'#0f172a',earIn:'#334155',nose:'#0f172a',accent:'#94a3b8'},

    heart:{body:'#fda4af',belly:'#ffe4e6',ear:'#fb7185',earIn:'#fecdd3',nose:'#9f1239',accent:'#f43f5e'},
    moon:{body:'#fde68a',belly:'#fffbeb',ear:'#fbbf24',earIn:'#fef3c7',nose:'#b45309',accent:'#f59e0b'}
  };
  const c=P[kind]||P.fox;
  const longEar = (kind==='rabbit');
  const pandaPatch = (kind==='panda');
  const earL = longEar
    ? `<ellipse cx="38" cy="18" rx="10" ry="28" fill="${c.ear}" transform="rotate(-18 38 18)"/><ellipse cx="38" cy="18" rx="5" ry="18" fill="${c.earIn}" transform="rotate(-18 38 18)"/>`

  const earR = longEar
    ? `<ellipse cx="82" cy="18" rx="10" ry="28" fill="${c.ear}" transform="rotate(18 82 18)"/><ellipse cx="82" cy="18" rx="5" ry="18" fill="${c.earIn}" transform="rotate(18 82 18)"/>`
    : `<path d="M88 40 L98 14 L70 32 Z" fill="${c.ear}"/><path d="M86 36 L92 20 L74 32 Z" fill="${c.earIn}"/>`;
  const patches = pandaPatch
    ? `<ellipse cx="46" cy="56" rx="12" ry="11" fill="#0f172a" opacity=".9"/><ellipse cx="74" cy="56" rx="12" ry="11" fill="#0f172a" opacity=".9"/>`
    : '';
  const eyeFill = pandaPatch ? '#fff' : '#0f172a';
  const eyeWhite = pandaPatch ? '' : `<ellipse cx="48" cy="56" rx="7" ry="8" fill="#fff"/><ellipse cx="72" cy="56" rx="7" ry="8" fill="#fff"/>`;
  const spark = opts.spark!==false ? `<circle class="spark" cx="16" cy="30" r="2.8" fill="#fde68a"/><circle class="spark" cx="104" cy="26" r="2.2" fill="#a5f3fc"/>` : '';
  const lab = label ? `<text x="60" y="112" text-anchor="middle" font-size="10" fill="#64748b" font-family="system-ui,sans-serif">${label}</text>` : '';
  return `<svg viewBox="0 0 120 120" width="${w}" height="${w}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <ellipse cx="60" cy="108" rx="26" ry="5" fill="#cbd5e1" opacity=".4"/>
  <ellipse cx="60" cy="82" rx="28" ry="24" fill="${c.body}"/>
  <ellipse cx="60" cy="86" rx="18" ry="14" fill="${c.belly}"/>
  <circle cx="60" cy="52" r="34" fill="${c.body}"/>
  ${earL}${earR}${patches}${eyeWhite}
  <ellipse class="eye" cx="49" cy="57" rx="3.3" ry="4.2" fill="${eyeFill}"/><ellipse class="eye r" cx="73" cy="57" rx="3.3" ry="4.2" fill="${eyeFill}"/>

  <ellipse class="cheek" cx="84" cy="64" rx="5.5" ry="3.5" fill="#fb7185" opacity=".5"/>
  <ellipse cx="60" cy="66" rx="4.2" ry="3.2" fill="${c.nose}"/>
  <path d="M55 70 Q60 75 65 70" fill="none" stroke="${c.nose}" stroke-width="1.7" stroke-linecap="round"/>
  ${spark}${lab}
</svg>`;
}
const CAT_MASCOT={
  qin:'owl', qi:'bear', shu:'rabbit', hua:'cat', fit:'chick', speak:'fox',
  think:'star', xuan:'moon', memory:'fish', tcm:'leaf', care:'heart', yijing:'moon'
};
function mascotHTML(cat, cls){
  const kind=CAT_MASCOT[cat]||'fox';
  return `<div class="mascot ${cls||'mascot-float'}" data-kind="${kind}">${mascotSVG(kind,{size:120,spark:true})}</div>`;
}
function celebrateMascot(cat){
  const host=document.getElementById('mascotCeleb');
  if(!host) return;
  const kind=CAT_MASCOT[cat]||'fox';
  host.hidden=false;
  host.className='mascot mascot-celeb';
  host.innerHTML=mascotSVG(kind,{size:120,label:'學完！',spark:true});
  clearTimeout(celebrateMascot._t);
  celebrateMascot._t=setTimeout(function(){ host.hidden=true; host.innerHTML=''; },1400);
}

個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p><h4>空耳小貼士</h4><p>理論都試吓唱／彈出聲；耳同手一齊先記住。</p></div>", "diagram": "<svg viewBox=\"0 0 360 80\" width=\"100%\" style=\"max-width:360px;background:#f0fdfa;border-radius:10px\">\n  <text x=\"16\" y=\"28\" font-size=\"14\" fill=\"#0f766e\">C→D 大二度　C→E 大三度　A→C 小三度</text>\n  <text x=\"16\" y=\"58\" font-size=\"14\" fill=\"#134e4a\">白鍵：C D E F G A B C</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>琴上慢彈：C–D、C–E、A–C，各 8 次，邊彈邊講「大二／大三／小三」。</li>\n<li>隨機抽兩音（只用白鍵），講出係隔幾度（先數白鍵）。</li>\n<li>聽辨自測：自己錄 6 組，亂序播，寫答案再核對。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. C 到 E 係咩音程？</summary><p>答：大三度。</p></details>\n<details><summary>Q2. 點解三度重要？</summary><p>答：大／小三和弦嘅「性格」由三度決定。</p></details>\n<details><summary>Q3. A–C 比較似明亮定柔和？</summary><p>答：柔和（小三度）。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["數音程：由低音向上數「度」，包含起音。", "純五度 C–G 之後會用嚟搭和弦。", "常見錯：把「隔一個鍵」同「兩個半音」混淆——先用白鍵建立直覺。", "Sing：用唱名鞏固聽感。", "下一課：大三 vs 小三和弦。", "Apps：相對音感訓練每日 3 分鐘。", "同節奏課結合：音程用四分音符彈。", "寫低今日聽錯嘅一組，聽日重測。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "和弦色：大三 vs 小三", "mins": 11, "summary": "親手彈 C 大三同 A 小三，建立「明亮／柔和」聽感同組成公式。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "記住公式並能彈：大三＝根＋大三＋五；小三＝根＋小三＋五。 完成練習＋自測，並用一句話總結。", "takeaway": "大三明亮、小三柔和；兩者只差「中間嗰個三度音」。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p><strong>三和弦</strong>一次疊三個音。以根音為家：</p>\n<p><strong>大三和弦</strong>＝根音＋大三度＋純五度。例：C–E–G（C major）。聽感偏明亮、穩定。</p>\n<p><strong>小三和弦</strong>＝根音＋小三度＋純五度。例：A–C–E（A minor）。聽感偏柔和、帶少少愁。</p>\n<p>C 大調嘅關係小調係 A 小調——兩套和弦共用調號（無升降），好適合入門對比。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p><h4>空耳小貼士</h4><p>理論都試吓唱／彈出聲；耳同手一齊先記住。</p></div>", "diagram": "<svg viewBox=\"0 0 400 70\" width=\"100%\" style=\"max-width:400px;background:#f0fdfa;border-radius:10px\">\n  <text x=\"16\" y=\"30\" font-size=\"16\" fill=\"#0f766e\">C major: C–E–G　｜　A minor: A–C–E</text>\n  <text x=\"16\" y=\"55\" font-size=\"13\" fill=\"#134e4a\">只係「中間音」大三 vs 小三</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>右手齊彈 C–E–G，維持 4 拍×4 次；再彈 A–C–E 同樣。</li>\n<li>交替：大→小→大→小，感受顏色轉換。</li>\n<li>請人／用 App 亂序播放大／小，你猜 10 題，目標 ≥7 題啱。</li>\n<li>左手只彈根音（C 或 A），右手彈齊奏，各 4 次。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. C 大三有邊三個音？</summary><p>答：C、E、G。</p></details>\n<details><summary>Q2. 大三同小三差喺邊？</summary><p>答：三度音（大三度 vs 小三度）。</p></details>\n<details><summary>Q3. A 小三聽感偏？</summary><p>答：柔和／帶愁。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["轉位之後會學：同一和弦可換低音。", "流行曲超常用大／小對比情緒。", "常見錯：漏彈五度音，和弦會「扁」。", "指法提示：C–E–G 可用 1–3–5。", "下一課：I–V–vi–IV 進行。", "用同一力度彈大細，先聽「音程色」唔係音量差。", "Hum 根音再疊上去。", "寫感情詞：明亮／柔和／緊張…訓練描述。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "流行核心：I–V–vi–IV 進行", "mins": 12, "summary": "學懂 C 調上 I–V–vi–IV（C–G–Am–F）點解無處不在，並跟住彈一輪。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "能背出度數同和弦名，並以每和弦 2 或 4 拍循環彈奏。 完成練習＋自測，並用一句話總結。", "takeaway": "I–V–vi–IV 係超常用流行進行；喺 C 調＝C–G–Am–F。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>調內和弦用<strong>羅馬數字</strong>標記：I＝主音上嘅大三（家）、V＝屬音（拉力好強、想返 I）、vi＝關係小調主和弦、IV＝下屬（開放感）。</p>\n<p>喺 <strong>C 大調</strong>：I＝C、V＝G、vi＝Am、IV＝F。成句聽落似「起→拉→柔→開→返」。無數流行歌用呢個骨架（有時順序微調）。</p>\n<p>你唔使一次記晒所有調：先喺 C 調練到「肌肉＋耳朵」記住拉力。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p><h4>空耳小貼士</h4><p>理論都試吓唱／彈出聲；耳同手一齊先記住。</p></div>", "diagram": "<svg viewBox=\"0 0 420 70\" width=\"100%\" style=\"max-width:420px;background:#f0fdfa;border-radius:10px\">\n  <text x=\"12\" y=\"32\" font-size=\"15\" fill=\"#0f766e\">I (C) → V (G) → vi (Am) → IV (F) → I …</text>\n  <text x=\"12\" y=\"55\" font-size=\"12\" fill=\"#134e4a\">每格 2 或 4 拍</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>彈齊奏：C | G | Am | F，每和弦 <strong>4 拍</strong>，循環 <strong>4 輪</strong>。</li>\n<li>改每和弦 2 拍，再 4 輪（訓練換和弦速度）。</li>\n<li>口數「one-two-three-four」換位；換唔切就放慢節拍器。</li>\n<li>試用左手只彈根音 C–G–A–F，右手彈和弦。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. C 調嘅 V 係邊個和弦？</summary><p>答：G（大三）。</p></details>\n<details><summary>Q2. vi 喺 C 調係？</summary><p>答：Am。</p></details>\n<details><summary>Q3. V 聽落點解「想返 I」？</summary><p>答：屬和弦張力大，解決去主和弦最穩定。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["同一進行喺 G 調＝G–D–Em–C，之後先學。", "聽歌時默念度數，超練耳。", "常見錯：Am 彈成 A major（多咗升 C）。", "F 大三：F–A–C。", "下一課：調號（升降）。", "可用烏克麗麗／結他 App 對照同一進行。", "寫低你識嘅一首歌，睇係咪呢個進行。", "錄低今日最好嘅一輪做基準。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "調號速記：升降號入門", "mins": 9, "summary": "見到譜號旁 #／♭ 知大概調性；先記 0 同 1 個升降。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "見到 0／1 個升或降號，能講出對應大調（同關係小調）。 完成練習＋自測，並用一句話總結。", "takeaway": "無升降＝C／Am；1 個 #＝G／Em；1 個 ♭＝F／Dm。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p><strong>調號</strong>寫喺譜號後面，話你知呢首邊啲音要長期升／降。佢同「呢首以邊個音做家（主音）」有關。</p>\n<p>入門只記三組就夠用：</p>\n<p>• 無 #／♭ → <strong>C 大調</strong>（關係小調 A 小）<br>\n• 一個 #（升 F）→ <strong>G 大調</strong>（關係小調 E 小）<br>\n• 一個 ♭（降 B）→ <strong>F 大調</strong>（關係小調 D 小）</p>\n<p>升號出現順序口訣：F C G D A E B；降號相反。而家唔使背晒，知「第一個升係 F、第一個降係 B」就得。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p><h4>空耳小貼士</h4><p>理論都試吓唱／彈出聲；耳同手一齊先記住。</p></div>", "diagram": "<svg viewBox=\"0 0 400 70\" width=\"100%\" style=\"max-width:400px;background:#f0fdfa;border-radius:10px\">\n  <text x=\"14\" y=\"28\" font-size=\"14\" fill=\"#0f766e\">0：C / Am　　#：G / Em　　♭：F / Dm</text>\n  <text x=\"14\" y=\"52\" font-size=\"12\" fill=\"#134e4a\">第一個升＝F＃　第一個降＝B♭</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>用紙畫三種調號，旁邊寫大調名，抄 2 次。</li>\n<li>喺琴上彈 G 大調音階白鍵但 F 要升：G A B C D E F# G。</li>\n<li>彈 F 大調：F G A Bb C D E F（B 降）。</li>\n<li>閃卡自測：睇調號講調名，10 次。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 一個升號通常係咩大調？</summary><p>答：G 大調。</p></details>\n<details><summary>Q2. F 大調要降邊個音？</summary><p>答：B（變 B♭）。</p></details>\n<details><summary>Q3. C 大調關係小調？</summary><p>答：A 小調。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["關係大小調共用調號，主音差小三度。", "常見錯：見到 # 就以為一定係「全部音都升」。", "先彈音階再彈該調 I–V–vi–IV。", "下一課：樂句呼吸。", "譜上臨時升降（accidentals）只影響當小節。", "用舊譜封面認調號當遊戲。", "Em 係 G 嘅關係小調，聽落偏柔。", "唔好一次啃到五個升降——易放棄。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "大調音階：C 大調八度", "mins": 10, "summary": "掌握全全半全全全半結構，彈熟 C 大調上行下行。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "背出口訣「全全半全全全半」，並流暢彈 C 大調一 octave。 完成練習＋自測，並用一句話總結。", "takeaway": "大調音階結構固定；C 大調全係白鍵，最易上手。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p><strong>半音</strong>＝琴上相鄰鍵（含黑鍵）最短距離；<strong>全音</strong>＝兩個半音。</p>\n<p>大調音階公式：<strong>全–全–半–全–全–全–半</strong>。套喺 C：C–D（全）D–E（全）E–F（半）F–G（全）…B–C（半）。所以 C 大調唔使黑鍵。</p>\n<p>彈音階係為咗手指均勻、認識調性「家在哪」，亦係即興同學譜嘅底子。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p><h4>空耳小貼士</h4><p>理論都試吓唱／彈出聲；耳同手一齊先記住。</p></div>", "diagram": "<svg viewBox=\"0 0 420 60\" width=\"100%\" style=\"max-width:420px;background:#f0fdfa;border-radius:10px\">\n  <text x=\"12\" y=\"35\" font-size=\"14\" fill=\"#0f766e\">C D E F G A B C　｜　W W H W W W H</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>右手 1–2–3，拇指穿過打 F（指法常見：1 2 3 1 2 3 4 5 上行）。</li>\n<li>上行下行各 <strong>5 次</strong>，節拍器 60，一音一拍。</li>\n<li>每音力度一致；錯就放慢，唔好加速遮醜。</li>\n<li>講出「邊兩音之間係半音」（E–F、B–C）。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 大調公式第一個字？</summary><p>答：全（W）。</p></details>\n<details><summary>Q2. C 大調邊度係半音？</summary><p>答：E–F 同 B–C。</p></details>\n<details><summary>Q3. 點解 C 大調適合新手？</summary><p>答：全白鍵，視覺同觸覺簡單。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["指法唔唯一，但「3 之後拇指穿」係主流。", "常見錯：穿指時肩膀聳起。", "下一課可移到 G 大調（加 F#）。", "分手練再合。", "用全音符→四分→八分變奏同一音階。", "眼睛唔睇手，訓練空間感。", "音階係工具唔係表演——穩同均勻先。", "伸指熱身 1 分鐘。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "樂句呼吸：四小節一句", "mins": 8, "summary": "彈琴要有句號感：四小節一呼吸，尾音稍弱稍慢。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "喺一段 4 小節短句中，做出明顯「句尾」同「下句開頭」。 完成練習＋自測，並用一句話總結。", "takeaway": "樂句像說話：有逗號同句號；句尾收、下句再起。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>音符連住唔等於「一句氣扯到底」。音樂嘅 <strong>phrasing（樂句）</strong> 類似語言：4 小節常見一句，第 4 小節尾稍弱、稍慢（轻微 rubato），然後下句清晰進入。</p>\n<p>技術上你會：句中保持流動；句尾減力度；換句前手腕放鬆似換氣。聽者先覺得你「識唱歌咁彈琴」。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p><h4>空耳小貼士</h4><p>理論都試吓唱／彈出聲；耳同手一齊先記住。</p></div>", "diagram": "<svg viewBox=\"0 0 380 70\" width=\"100%\" style=\"max-width:380px;background:#f0fdfa;border-radius:10px\">\n  <path d=\"M30 45 Q100 15 170 45 Q240 70 310 40\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"3\"/>\n  <text x=\"140\" y=\"62\" font-size=\"12\" fill=\"#134e4a\">弧線＝一句</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>用 C–D–E–F | G–F–E–D 當成兩句（每句 4 音當 4 拍）。</li>\n<li>第一句尾 D 彈弱 20%；第二句 C 再清晰起。</li>\n<li>錄音對比「無句尾」vs「有句尾」各 1 次。</li>\n<li>用手喺空中畫弧線跟住彈。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 樂句尾通常點處理？</summary><p>答：稍弱、可稍慢，似句號。</p></details>\n<details><summary>Q2. 點解要 phrasing？</summary><p>答：令音樂似說話，唔係拍節器機械音。</p></details>\n<details><summary>Q3. 換句前身體可做咩？</summary><p>答：手腕／呼吸放鬆，似換氣。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["唱歌同句再回琴，轉移感覺最快。", "常見錯：每粒音一樣大聲＝平板。", "樂句長度唔一定 4，但入門用 4。", "下一輪：喺 I–V–vi–IV 每和弦當半句。", "睇譜時用鉛筆畫弧線。", "聽慢板作品專學呼吸。", "唔好用踏板遮糊句尾。", "影片自拍手勢同弧線。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "空耳：音程聽辨（小二／大三／純五）", "mins": 12, "summary": "Web Audio 播音程你揀答案；ABRSM aural 取向基本功。", "goal": "辨認小二、大三、純五各 3 次；能哼根音。", "takeaway": "先唱再猜；音程係聽力細胞。", "concept": "<div class=\"concept\">\n<p>空耳＝ear training。小二=1 半音、大三=4、純五=7。</p>\n<h4>方法</h4>\n<p>聽→哼根→哼上→估遠近再性質</p>\n<h4>八級</h4>\n<p>Aural 常考音程性質</p>\n</div>", "diagram": "<svg class=\"anim-svg\" viewBox=\"0 0 420 90\" width=\"100%\" style=\"max-width:420px;background:#f0fdfa;border-radius:12px\"><g stroke=\"#0f766e\" stroke-width=\"1.5\"><path d=\"M20 20 H400\"/><path d=\"M20 32 H400\"/><path d=\"M20 44 H400\"/><path d=\"M20 56 H400\"/><path d=\"M20 68 H400\"/></g><ellipse class=\"note-pulse\" cx=\"140\" cy=\"56\" rx=\"9\" ry=\"7\" fill=\"#0f766e\"/><ellipse class=\"note-pulse dly\" cx=\"260\" cy=\"32\" rx=\"9\" ry=\"7\" fill=\"#b45309\"/><text x=\"120\" y=\"84\" font-size=\"12\" fill=\"#0f766e\">根音 → 上方音</text></svg><div class=\"ear-box\"><p><strong>撳播放再揀：</strong></p><button type=\"button\" class=\"sm primary\" data-act=\"playinterval\" data-semi=\"1\">▶ 樣本 A</button> <button type=\"button\" class=\"sm primary\" data-act=\"playinterval\" data-semi=\"4\">▶ 樣本 B</button> <button type=\"button\" class=\"sm primary\" data-act=\"playinterval\" data-semi=\"7\">▶ 樣本 C</button><div class=\"q-inline\" data-ans=\"0\"><strong>A（1半音）？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">小二</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">大三</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">純五</button> <span class=\"q-fb\"></span></div><div class=\"q-inline\" data-ans=\"1\"><strong>B（4半音）？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">小二</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">大三</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">純五</button> <span class=\"q-fb\"></span></div><div class=\"q-inline\" data-ans=\"2\"><strong>C（7半音）？</strong> <button type=\"button\" class=\"sm\" da ox\" data-work=\"60\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">穩拍 60 秒</button></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 第一步？</summary><p>捉穩拍</p></details>\n<details><summary>Q2. 附點？</summary><p>長－短</p></details>\n</div>", "more": ["節拍器", "由易到難", "past aural", "分手脚", "休息", "正確率", "視奏互促", "自我慈悲"]}], "qi": [{"title": "圍棋：氣同提子", "mins": 10, "summary": "棋子靠「氣」生存；封晒氣就可以提走對方——用 5×5 紙盤即刻練。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "能講清氣、連棋共用氣、提子三件事，並喺 5×5 完成一盤專注提子。 完成練習＋自測，並用一句話總結。", "takeaway": "氣＝上下左右空點；氣變 0 → 提子離盤。先求唔隨意俾人提。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>圍棋每顆子放喺交叉點。一顆子嘅 <strong>氣（liberties）</strong> 係佢上、下、左、右相連嘅空交叉點（斜唔算）。</p>\n<p>己方相連成一塊嘅子 <strong>共享氣</strong>。對方用子把你最後一口氣都佔住 → 你呢塊棋氣＝0，就被 <strong>提子</strong> 拿走。</p>\n<p>入門唔使識佈局理論：今日只訓練「落子前掃一眼：我同對方仲有幾多氣」。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 280 120\" width=\"100%\" style=\"max-width:280px;background:#ede9fe;border-radius:12px\">\n  <g stroke=\"#7c3aed\" stroke-width=\"1.2\" opacity=\".7\"><path d=\"M40 20 V100 M70 20 V100 M100 20 V100 M130 20 V100 M160 20 V100\"/>\n  <path d=\"M30 30 H170 M30 60 H170 M30 90 H170\"/></g>\n  <circle cx=\"70\" cy=\"60\" r=\"10\" fill=\"#1c1917\"/>\n  <circle cx=\"100\" cy=\"60\" r=\"10\" fill=\"#fafaf9\" stroke=\"#1c1917\" stroke-width=\"2\"/>\n  <text x=\"190\" y=\"55\" font-size=\"11\" fill=\"#5b21b6\">黑氣示意</text>\n  <text x=\"190\" y=\"75\" font-size=\"11\" fill=\"#5b21b6\">白正試封氣</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>紙上畫 5×5 線，黑白輪流（可自己打自己）。</li>\n<li>每步落子前講出：「呢步後我塊棋仲有 __ 氣」。</li>\n<li>刻意製造一次「提一子」，體驗封氣。</li>\n<li>下完回放：邊步係自殺式亂衝。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 氣包唔包斜向？</summary><p>答：唔包；只計上下左右。</p></details>\n<details><summary>Q2. 相連己子點樣計氣？</summary><p>答：整塊共享外圍空點。</p></details>\n<details><summary>Q3. 氣＝0 會點？</summary><p>答：被提子離盤。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["自殺手一般禁止（特殊劫爭例外，入門先唔好打架劫）。", "先求生存，再學圍空。", "常見錯：只顧圍大空，忽略被打吃。", "App：艾心圍棋／OGS 9 路。", "金角銀邊之後先學。", "被打吃時優先逃或做眼。", "「長氣」＝多留氣口。", "5×5 練完先上 9 路。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "圍棋：金角銀邊草肚皮", "mins": 9, "summary": "開局優先佔角、再邊、最後中腹——效率同根據地。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "明白點解角最易成空，並喺 9 路練習「先角後邊」。 完成練習＋自測，並用一句話總結。", "takeaway": "角兩邊有邊界幫手圍空；中腹四面受敵，開局最唔抵。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>圍空效率：<strong>角</strong> 有兩條邊做牆，用較少子可圍較多空；<strong>邊</strong> 有一條邊界；<strong>中腹</strong> 四邊都要自己圍，開局投放回報低——所以有「金角銀邊草肚皮」。</p>\n<p>實戰開局常見：星位、小目等佔角；再拆邊建立根據地；中盤先因戰鬥進入中腹。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 200 120\" width=\"180\" style=\"background:#ede9fe;border-radius:12px\">\n  <rect x=\"20\" y=\"10\" width=\"100\" height=\"100\" fill=\"none\" stroke=\"#7c3aed\"/>\n  <circle cx=\"35\" cy=\"25\" r=\"7\" fill=\"#1c1917\"/>\n  <circle cx=\"105\" cy=\"25\" r=\"7\" fill=\"#1c1917\"/>\n  <circle cx=\"35\" cy=\"95\" r=\"7\" fill=\"#fafaf9\" stroke=\"#1c1917\"/>\n  <text x=\"130\" y=\"40\" font-size=\"11\" fill=\"#5b21b6\">先佔角</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>9 路自戰：前 8 手強制只准落角／近角。</li>\n<li>之後先准落邊；第 20 手前唔准無故衝中腹。</li>\n<li>終盤數空：邊角空通常多過亂衝中腹。</li>\n<li>寫一句反思：邊步衝中導致被切斷。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 點解角係「金」？</summary><p>答：兩邊邊界協助圍空，效率高。</p></details>\n<details><summary>Q2. 開局亂入中腹有咩問題？</summary><p>答：四面受敵，難成空又易被攻。</p></details>\n<details><summary>Q3. 佔角之後通常做咩？</summary><p>答：沿邊拆，擴大根據地。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["星位速度快；小目穩健——入門星位夠。", "拆邊注意間隔，太遠難連。", "常見錯：對方佔三角你先去搶中。", "守角同掛角之後先學。", "看職業棋譜只睇前 20 手佔邊角。", "根據地＝有眼位潛力嘅基地。", "被侵入角時先判斷死活再追。", "9 路熟悉再 13／19。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "國際象棋：子力價值", "mins": 9, "summary": "兵1、馬象3、車5、后9——交易前心算划唔划算。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "背熟基本分值，並能判斷簡單兌換是否虧子。 完成練習＋自測，並用一句話總結。", "takeaway": "冇戰術理由唔好用貴子換平子；分值係指南唔係絕對。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>入門兌換用「子力價值」心算：<strong>兵≈1，馬≈3，象≈3，車≈5，后≈9，王＝無限（唔能換走）</strong>。</p>\n<p>例：用車（5）換馬（3）通常虧 2 分，除非因此將死、得大量兵、或打開致命線。</p>\n<p>分值係平均指南：殘局象馬價值會變；雙象有時優於馬象。但今日先建立「唔亂換」習慣。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 360 60\" width=\"100%\" style=\"max-width:360px;background:#ede9fe;border-radius:10px\">\n  <text x=\"12\" y=\"35\" font-size=\"14\" fill=\"#5b21b6\">♙1　♘♗3　♖5　♕9　♔∞</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>背誦分值 3 次，寫出嚟唔睇。</li>\n<li>題：白馬換黑雙兵——大概幾分？係咪常規等值？（約 3 vs 2，略虧／視位置）</li>\n<li>喺 App 殘局中，每次兌換前講「我失 X 得 Y」。</li>\n<li>找出一盤自己過去對局，標一處虧換。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 車大概幾分？</summary><p>答：5。</p></details>\n<details><summary>Q2. 后換車＋馬係咪等值？</summary><p>答：約 9 vs 8，接近，視局面。</p></details>\n<details><summary>Q3. 點解仲要睇戰術？</summary><p>答：將死／穿透／捉雙可以令「虧分兌換」仍然正確。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["捉雙、釘死、閃將可打破分值。", "常見錯：捨后換車只因「想簡化」。", "開局唔好過早出動后俾人追。", "殘局王要積極參與。", "Chess.com lessons：trades。", "象睇遠距，馬睇跳——同分唔同個性。", "紀錄：每盤只容許一次「自覺虧換實驗」。", "下一步：易位安全。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "國際象棋：王車易位", "mins": 10, "summary": "一次過令王安全、車入局；搞清條件同短易位步驟。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "能列出易位四條件，並喺開局練習中完成短易位。 完成練習＋自測，並用一句話總結。", "takeaway": "短易位：王向車走兩格，車跳過王；前提係王車未郁、路空、唔經將軍。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p><strong>易位（castling）</strong>係唯一可以一回合郁兩隻子嘅著法。目的：王入側翼安全區，車由角位拉入中心文件。</p>\n<p><strong>條件</strong>：①王同該側車都未郁過；②中間格全空；③王而家唔被將軍；④王經過同落到嘅格唔受攻擊。</p>\n<p><strong>短易位（王側）</strong>：白王 e1→g1，車 h1→f1。長易位（后側）王走兩格去 c1，車到 d1——入門先練短易位。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 320 80\" width=\"100%\" style=\"max-width:320px;background:#ede9fe;border-radius:10px\">\n  <text x=\"12\" y=\"30\" font-size=\"13\" fill=\"#5b21b6\">短易位：♔ e1→g1　♖ h1→f1</text>\n  <text x=\"12\" y=\"55\" font-size=\"12\" fill=\"#6d28d9\">中間 f1、g1 要安全</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>開局只動王翼子：馬 f3、象（視開局）、然後短易位。</li>\n<li>用 App「對電腦最低級」目標：10 步內完成短易位，連做 3 盤。</li>\n<li>自問檢查清單：未郁？路空？經格安全？</li>\n<li>試一次「被將軍時唔可以易位」嘅感覺（用設置）。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 易位可以郁幾隻子？</summary><p>答：兩隻（王＋車）。</p></details>\n<details><summary>Q2. 王被將軍時可否易位？</summary><p>答：唔可以。</p></details>\n<details><summary>Q3. 短易位白王去邊格？</summary><p>答：g1。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["易位後唔好亂推王前兵致弱格。", "常見錯：車郁過就失去該側易位權。", "長易位要額外留意 d 線同后翼安全。", "記譜：0-0 短；0-0-0 長。", "開局原則：中心、發展、王車安全。", "被釘住中路王好易被抽。", "下一課：威脅優先思維。", "看大師開局幾步易位。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "策略微課：威脅優先", "mins": 8, "summary": "每步前先問「對方下一手最殺我邊？」——棋類通用防守優先。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "養成落子前三秒檢查清單：被將／被捉／被威脅先處理。 完成練習＋自測，並用一句話總結。", "takeaway": "弱點未補唔好猛攻；先止損，再加碼。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>好多敗局唔係因為唔夠攻擊力，而係<strong>忽略對方威脅</strong>。通用順序：</p>\n<p>1）我而家被將軍？→ 必須解将<br>\n2）有貴重子被捉／下一手會失子？→ 逃、保、反捉或中途兌換<br>\n3）先安全，先考慮自己嘅進攻格</p>\n<p>呢個同日常決策一樣：先止漏水，再裝修。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 340 60\" width=\"100%\" style=\"max-width:340px;background:#ede9fe;border-radius:10px\">\n  <text x=\"12\" y=\"35\" font-size=\"13\" fill=\"#5b21b6\">解将 → 護子 → 先手威脅 → 改進位置</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>下一盤慢棋：每步強制寫「對方威脅：___」先落子。</li>\n<li>若想進攻，先確認自己冇被捉雙／殺棋。</li>\n<li>覆盤標出三次「無視威脅」嘅步。</li>\n<li>用圍棋／象棋同一口訣各做 10 分鐘。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 被將軍時可否繼續攻？</summary><p>答：唔得，必須先解将。</p></details>\n<details><summary>Q2. 威脅優先同「懦弱」有咩分別？</summary><p>答：係順序問題；安全後一樣可猛攻。</p></details>\n<details><summary>Q3. 日常類比？</summary><p>答：先止損再加碼／先補漏再擴張。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["強棋手攻防一體：進攻同時限制反擊。", "常見錯：沉浸組合計算卻漏被殺。", "檢查：對手上一手目的係咩？", "用「如果我係對方會點罰我」反問。", "閃將、牽制要納入威脅清單。", "時間緊張時更要先掃王安全。", "下一課：簡單殺法思維。", "紙上記三條常犯漏看。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "圍棋：打吃同逃", "mins": 9, "summary": "打吃＝只剩一氣；識得逃同反打吃，先至唔好無謂送子。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "識別打吃，並練習「被打吃時走出去」同「放緊氣」。 完成練習＋自測，並用一句話總結。", "takeaway": "只剩一氣＝打吃；唔處理下一手就被提。逃＝走向有氣處或做眼。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>當一塊棋<strong>只剩一氣</strong>，就叫被 <strong>打吃（atari）</strong>。對方下一手佔嗰氣，你就被提。</p>\n<p>應對：①逃——沿氣口延長，增加氣；②反打吃對方更急嘅棋；③做眼／連回大龍（稍後學）。入門最常見錯係「冇睇到自己被打吃」。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 260 100\" width=\"100%\" style=\"max-width:260px;background:#ede9fe;border-radius:12px\">\n  <g stroke=\"#7c3aed\" opacity=\".5\"><path d=\"M30 20 H150 M30 50 H150 M30 80 H150 M50 10 V90 M80 10 V90 M110 10 V90 M140 10 V90\"/></g>\n  <circle cx=\"80\" cy=\"50\" r=\"9\" fill=\"#1c1917\"/>\n  <circle cx=\"110\" cy=\"50\" r=\"9\" fill=\"#fafaf9\" stroke=\"#1c1917\" stroke-width=\"2\"/>\n  <text x=\"170\" y=\"55\" font-size=\"11\" fill=\"#5b21b6\">注意氣口</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>5×5：專門練習「叫吃→逃→再叫吃」。</li>\n<li>每步用手指指數對方同己方氣數。</li>\n<li>設定規則：被提一次就停，覆盤邊步漏睇。</li>\n<li>做 10 題死活入門圖（App atari drills）。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 打吃仲有幾多氣？</summary><p>答：1 氣。</p></details>\n<details><summary>Q2. 被打吃可唔可以唔理？</summary><p>答：多數唔得，下一手可能被提。</p></details>\n<details><summary>Q3. 最簡單應對？</summary><p>答：逃向有氣／寬氣方向。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["「接不歸」等型之後先學。", "常見錯：逃入死胡同。", "放緊氣（收氣）先於亂衝。", "雙叫吃更致命。", "練習：專下「提子遊戲」計分。", "眼位概念下一層。", "同象棋「被捉」同一級警覺。", "大聲講「atari」訓練察覺。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "象棋／國際象棋：先手同節奏", "mins": 8, "summary": "先手＝對方必須回應嘅著；用威脅換取時間同位置。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "分辨「有威脅嘅先手」同「空棋」，並喺練習中刻意做一次先手改進。 完成練習＋自測，並用一句話總結。", "takeaway": "好棋往往帶威脅；逼對方回應，你就賺Tempo。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p><strong>先手</strong>指你落一步帶實質威脅（殺、捉、打吃、將軍），對方不得不應，於是你再趁機改進另一側。</p>\n<p><strong>後手／空棋</strong>係對方可以無視、繼續執行自己計劃嘅步。入門常見：隨便推兵無目的，對方已經發展完成。</p>\n<p>訓練問題：「呢步佢唔應會唔會即時出事？」會→先手；唔會→小心你喺慢一步。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 320 55\" width=\"100%\" style=\"max-width:320px;background:#ede9fe;border-radius:10px\">\n  <text x=\"12\" y=\"32\" font-size=\"13\" fill=\"#5b21b6\">威脅 → 對方應 → 你再改進</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>揀一盤教學對局，標出 5 步先手。</li>\n<li>自戰：連續兩步要帶「可講得出嘅威脅」。</li>\n<li>若威脅假（對方可無視），改歩。</li>\n<li>覆盤問：邊段我喺行空棋？</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 將軍係咪先手？</summary><p>答：係（必須解）。</p></details>\n<details><summary>Q2. 空棋問題係咩？</summary><p>答：對方可推進計劃，你損失時間。</p></details>\n<details><summary>Q3. Tempo 係咩意思？</summary><p>答：節奏／步數時間優勢。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["假威脅＝對方應完你無跟進。", "多重威脅（一石二鳥）最強。", "圍棋「先手利」同理。", "唔好為咗先手而送子。", "記錄：今日一句「我用___威脅換到___」。", "下一步：簡單殘局王兵。", "看解說影片點講 tempo。", "閃將係經典先手戰術。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "迷你棋盤思維：角部接觸", "mins": 9, "summary": "圍棋角部短兵相接：活、死、交換——用細棋盤學接觸戰。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "喺角部接觸時問三句：能活？能逃？交換是否划算？ 完成練習＋自測，並用一句話總結。", "takeaway": "角部空間細，死活敏感；接觸前先算氣同出口。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>角係開局根據地，亦係接觸戰熱點。因為邊界限制，<strong>氣偏少、眼位型固定</strong>，所以亂碰角好易變成死活題。</p>\n<p>接觸三問：①我塊棋被斷後有冇兩眼潛力？②對方打吃我能否反打吃？③唔爭角改交換邊是否更大？</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<svg viewBox=\"0 0 160 100\" width=\"150\" style=\"background:#ede9fe;border-radius:12px\">\n  <path d=\"M20 20 H140 V140\" stroke=\"#7c3aed\" fill=\"none\"/>\n  <circle cx=\"50\" cy=\"50\" r=\"8\" fill=\"#1c1917\"/>\n  <circle cx=\"80\" cy=\"50\" r=\"8\" fill=\"#fafaf9\" stroke=\"#1c1917\"/>\n  <text x=\"30\" y=\"90\" font-size=\"11\" fill=\"#5b21b6\">角部接觸</text>\n</svg>", "practice": "<ol class=\"steps\">\n<li>只喺棋盤一角（想像 6×6 區域）擺接觸，雙方限 15 手。</li>\n<li>每手講氣數。</li>\n<li>結束判斷：邊塊活、邊塊死、交換幾子。</li>\n<li>重擺一次，改用「唔硬碰、先補強」策略對比。</li>\n</ol><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 點解角部死活敏感？</summary><p>答：邊界令氣同眼位受限。</p></details>\n<details><summary>Q2. 接觸前要算咩？</summary><p>答：氣、出口、能否做眼。</p></details>\n<details><summary>Q3. 交換思維係咩？</summary><p>答：放棄局部換更大實地／外勢。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["死活題每日 2 條好過盲下。", "常見錯：角未穩就拆太遠。", "二路同三路手法之後學。", "「靠、夾、扳」術語慢慢累積。", "用死活書入門篇。", "外勢轉實地要時機。", "下一課可重溫提子＋角。", "影低自己擺譜。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}], "shu": [{"title": "讀書札記：ORID 四句", "mins": 12, "summary": "用客觀→感受→詮釋→決定寫短筆記；今日有填好範例可抄，再寫你自己一篇。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "讀一小段材料後，用 ORID 四句完成一則 ≤10 行札記。 完成練習＋自測，並用一句話總結。", "takeaway": "札記唔係抄書；ORID 逼你由事實走到可執行下一步。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p><strong>O Objective</strong>：客觀——書裡一句原話／可核對事實（唔加評價）。</p>\n<p><strong>R Reflective</strong>：感受——你當下情緒、聯想、阻力。</p>\n<p><strong>I Interpretive</strong>：詮釋——呢點同你工作／生活有咩結構性關係？</p>\n<p><strong>D Decisional</strong>：決定——24–48 小時內可完成嘅細行動（一個就夠）。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<div class=\"filled\">【填好範例｜主題：午膳後急步】\nO：文章寫「飯後 15 分鐘急步有助血糖回落」。\nR：我覺得可行，但擔心返工遲。\nI：問題唔係知識，而係行程冇預留緩衝。\nD：聽日起，出公司前鬧鐘＋15 分鐘，只行商場兩圈。</div>", "practice": "<ol class=\"steps\">\n<li>揀一段 5–10 分鐘閱讀（文章／書／newsletter）。</li>\n<li>對住範例格式，寫你嘅 O–R–I–D（每項 1–2 句）。</li>\n<li>檢查 D：係咪具體到「時間＋動作」？唔係就改。</li>\n<li>放入空白框 mentally：聽日只執行 D。</li>\n</ol>\n<div class=\"blank\">【你的空白提示】O：…　R：…　I：…　D：…</div><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. O 欄最忌寫咩？</summary><p>答：夾帶評價／感想（嗰啲放 R／I）。</p></details>\n<details><summary>Q2. D 點樣先算合格？</summary><p>答：短時間內可完成、可觀察有無做到。</p></details>\n<details><summary>Q3. 點解唔直接抄金句？</summary><p>答：抄唔等於消化；ORID 強制連結行動。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["一週重溫所有 D，打勾邊項真係做咗。", "ORID 源自焦點討論法，會議都用得。", "常見錯：I 寫到好空泛（「好重要」）——改成機制。", "電子筆記用四個標題固定模板。", "同一本書連續 3 日 ORID，會見到主題重複。", "可加第五行：一句英文摘要。", "唔好一日寫多過兩個 D。", "下一課：結論先行短文。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "短文表達：結論先行", "mins": 11, "summary": "先一句結論，再兩理由，最後下一步——電郵／WhatsApp／匯報通用。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "用「結論→理由→下一步」模板寫一段 5–7 句短文。 完成練習＋自測，並用一句話總結。", "takeaway": "讀者先要答案；理由服務結論；結尾要可執行。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>香港職場同學習溝通，對方時間少。 <strong>結論先行</strong>令訊息可掃描：第一句就係立場／請求。</p>\n<p>結構：①結論（我認為／建議／需要…）②理由 1 ③理由 2（各一句，最好有事實）④下一步（邊個、幾時、做咩）。</p>\n<p>呢個同你思考習慣一致：先講清判斷，再撐住佢。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<div class=\"filled\">【填好範例｜題：點解午膳後要行 15 分鐘】\n結論：我建議我哋團隊試「飯後急步 15 分鐘」。\n理由1：有助午後唔好眼瞓，會議更清醒。\n理由2：唔使健身室，樓下商場就做得。\n下一步：我禮拜三 1:15 喺大堂等，有興趣一齊行。</div>", "practice": "<ol class=\"steps\">\n<li>抄範例結構，改寫成你真正想說嘅題（工作／學習／健康三選一）。</li>\n<li>刪走所有開頭客套「不好意思打擾…」——可放最後。</li>\n<li>讀出聲：有拗口長句就拆。 </li>\n<li>空白再寫第二題：只需 4 句。</li>\n</ol>\n<div class=\"blank\">結論：…\n理由1：…\n理由2：…\n下一步：…</div><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 第一句應放咩？</summary><p>答：結論／請求／建議。</p></details>\n<details><summary>Q2. 理由點樣先有力？</summary><p>答：具體事實或機制，唔係「我覺得好重要」。</p></details>\n<details><summary>Q3. 結尾點解要下一步？</summary><p>答：令對話可閉環，唔停留喺意見。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["電郵主旨都行結論先行。", "常見錯：背景寫 3 段先入題。", "WhatsApp 長訊用編號 1.2.3.。", "對上請示：結論＋選項 A/B。", "練習：改寫你昨日一則訊息。", "英文版：I recommend… Because… Next…", "避免一次塞三個請求。", "下一課：一句摘要力。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "一句摘要力", "mins": 9, "summary": "任何材料壓成一句 ≤25 字中文＋一句簡單英文，訓練抓重點。 含目標、結論、概念、圖例、練習、自測同延伸。", "goal": "完成「中＋英」各一句摘要，並能講清刪咗咩細節。 完成練習＋自測，並用一句話總結。", "takeaway": "摘要＝主題＋最重要結果；細節留給原文。 （可寫喺筆記首行。）", "concept": "<div class=\"concept\">\n<p>摘要能力＝閱讀理解嘅輸出端。公式：<strong>對象／主題＋發生咩／結果或主張</strong>。</p>\n<p>測試：講俾冇睇過嘅朋友聽，佢唔追問細節都知「大概係講緊咩」。若你摘要裡全係形容詞，通常未抓到結果。</p>\n<h4>延伸說明</h4><p>建議先讀結論再練習最後自測。若只有 5 分鐘：完成自測兩題＋一個跟住做步驟。</p><h4>常見誤解</h4><p>唔好一次貪多；短時高質量重複先有效。錯題寫入筆記隔日重做。</p></div>", "diagram": "<div class=\"filled\">【範例】原文假設講睡眠同專注力研究。\n中：研究指睡少於六小時會明顯拖低翌日專注力。\nEN：Sleep under six hours clearly hurts next-day focus.</div>", "practice": "<ol class=\"steps\">\n<li>讀／睇 5–10 分鐘材料。</li>\n<li>寫中文 ≤25 字；超字數就刪形容詞。</li>\n<li>寫一句英文（文法簡單得）。</li>\n<li>對朋友／自己覆述，問「仲想知咩」——嗰啲先係可選細節。</li>\n</ol>\n<div class=\"blank\">中文一句：…\nEnglish: …</div><h4>鞏固（額外）</h4><ol class=\"steps\"><li>用自己嘅話重述結論（可錄音）。</li><li>最難一點寫入錯題簿。</li><li>設定明日 3 分鐘溫習。</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 摘要應包含咩？</summary><p>答：主題＋最重要結果／主張。</p></details>\n<details><summary>Q2. 點解限字數？</summary><p>答：逼你取捨，唔係寫短文。</p></details>\n<details><summary>Q3. 全係形容詞有咩問題？</summary><p>答：缺少可核對嘅結果資訊。</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>完課後建議？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">即刷下一科</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">寫一句總結</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">刪檔</button> <span class=\"q-fb\"></span></div>", "more": ["會議結尾每人一句摘要＝對齊。", "常見錯：把金句當摘要。", "可先寫長再削。", "標籤化：#睡眠 #專注。", "雙語摘要順便練口語。", "一週收集 7 句做複習卡。", "對長文先分段一句，再總一句。", "下一課：對比觀點。", "詳細清單可喺「統計」頁導出。", "同其他範疇交錯學。", "善用 🔊 同音效。", "完成後撳「學完」計入統計。"]}, {"title": "札記：對比兩種觀點", "mins": 12, "summary": "同一題材建贊成／反對欄，再寫你嘅條件式取捨。
