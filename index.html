ils>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>最佳練習？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">只重讀表</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">先回憶再對</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">睡前刷短片</button> <span class=\"q-fb\"></span></div>", "more": ["可請人抽問", "錄音核對", "表格打分", "同統計導出", "週末加難", "保持路線", "一位一物", "好玩為上"]}, {"title": "綜合：一日宮殿任務卡", "mins": 12, "summary": "把宮殿流程做成每日任務卡：建／放／行／測／修。", "goal": "填一張任務卡並實際跑完一輪；導出心智清單。", "takeaway": "系統＞天份；每日小輪勝逢考前爆機。", "concept": "<div class=\"concept\">\n<p>任務卡五步：Build loci → Encode → Walk → Test → Fix。同本 App「學完」打卡一齊用。</p>\n</div>", "diagram": "<div class=\"filled\">☐ 8 loci 穩 ☐ 今日 5–8 物 ☐ 朝行 ☐ 夜測 ☐ 修 2 個漏項</div><svg class=\"anim-svg\" viewBox=\"0 0 420 160\" width=\"100%\" style=\"max-width:420px;background:#ecfeff;border-radius:12px\">\n  <path class=\"route-draw\" d=\"M40 120 L100 80 L160 110 L220 50 L280 90 L360 40\" fill=\"none\" stroke=\"#0891b2\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/>\n  <circle class=\"note-pulse\" cx=\"40\" cy=\"120\" r=\"10\" fill=\"#0e7490\"/><text x=\"40\" y=\"145\" text-anchor=\"middle\" font-size=\"11\">門</text>\n  <circle class=\"note-pulse dly\" cx=\"160\" cy=\"110\" r=\"10\" fill=\"#06b6d4\"/><text x=\"160\" y=\"145\" text-anchor=\"middle\" font-size=\"11\">沙發</text>\n  <circle class=\"note-pulse dly2\" cx=\"280\" cy=\"90\" r=\"10\" fill=\"#22d3ee\"/><text x=\"280\" y=\"145\" text-anchor=\"middle\" font-size=\"11\">窗</text>\n  <circle cx=\"360\" cy=\"40\" r=\"10\" fill=\"#67e8f9\"/><text x=\"360\" y=\"28\" text-anchor=\"middle\" font-size=\"11\">陽台</text>\n</svg>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>填空白任務卡</li><li>執行朝行</li><li>執行夜測</li><li>修漏</li><li>喺統計標學完</li></ol><div class=\"blank\">今日宮：…\n物件：…\n漏：…\n修：…</div><div class=\"timer-box\" data-work=\"300\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">完整輪 5 分</button></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. Fix 係？</summary><p>改畫面唔係自責</p></details>\n<details><summary>Q2. 爆機問題？</summary><p>無間隔易忘</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>核心？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">買課程</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">每日小輪提取</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">只收藏文章</button> <span class=\"q-fb\"></span></div>", "more": ["列印任務卡", "旅遊照樣跑", "英文＋數字分日", "同表達課金句入宮", "家族購物清單都得", "安全：機密勿放公共筆記", "保持簡", "完結庆祝"]}], "tcm": [{"title": "陰陽入門：對立同互根", "mins": 11, "summary": "陰陽作分類語言；日常作息例子；非診斷。", "goal": "用自己嘅話解釋陰陽互根；完成配對；讀聲明。", "takeaway": "陰陽係關係框架；唔係驗血報告。", "concept": "<div class=\"callout safety-xuan\"><strong>重要聲明：</strong>本科屬<strong>中醫文化／養生常識入門</strong>，<strong>唔係診斷、處方、唔取代註冊中醫或西醫</strong>。身體不適請求醫；唔好自行停藥或進補。</div><div class=\"concept\">\n<p>陰／陽描述對立統一（靜／動、寒／熱等）。</p>\n<h4>互根</h4>\n<p>無陰就無陽可對照。</p>\n<h4>思辨</h4>\n<p>唔好把複雜病況壓成單字陰陽。</p>\n</div>", "diagram": "<svg class=\"anim-svg\" viewBox=\"0 0 200 200\" width=\"100%\" style=\"max-width:200px\">\n  <circle cx=\"100\" cy=\"100\" r=\"90\" fill=\"#faf5ff\" stroke=\"#6d28d9\"/>\n  <path d=\"M100 10 A90 90 0 0 1 100 190 A45 45 0 0 1 100 100 A45 45 0 0 0 100 10\" fill=\"#1c1917\"/>\n  <circle cx=\"100\" cy=\"55\" r=\"12\" fill=\"#faf5ff\"/><circle cx=\"100\" cy=\"145\" r=\"12\" fill=\"#1c1917\"/>\n</svg><div class=\"tap-board\"><div class=\"tip\">撳位點睇提示</div><div class=\"tap-zones\"><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"多描述外向、溫熱、活動面向——作詞彙。\">陽</button><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"多描述內斂、涼潤、靜養面向——作詞彙。\">陰</button><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"兩者互相依存，唔係打爆對方。\">互根</button></div><div class=\"tap-out blank\">撳上面睇提示</div></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>讀聲明兩次</li><li>列 4 對日常陰陽類比（唔涉及治病）</li><li>寫：邊啲情況一定要求醫</li></ol><div class=\"blank\">類比：…\n求醫紅線：…</div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 本科定位？</summary><p>文化入門非診斷</p></details>\n<details><summary>Q2. 互根？</summary><p>互相依存</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>發燒好嚴重？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">自行陰陽調理</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">求醫</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">只食涼茶</button> <span class=\"q-fb\"></span></div>", "more": ["勿停處方藥", "懷孕／慢病先問醫生", "廣告補品小心", "可讀中醫史", "唔好標簽他人體質亂進補", "聲明常在", "記錄來源", "尊重科學檢查"]}, {"title": "五行：臟象對應（記憶用）", "mins": 12, "summary": "木火土金水同臟腑、顏色、味道嘅傳統對應表——當記憶圖，不當檢驗。", "goal": "背一張五行－臟簡表；能說「呢個係傳統對應」。", "takeaway": "五行係分類詩學；臨床要四診合參由專業做。", "concept": "<div class=\"callout safety-xuan\"><strong>重要聲明：</strong>本科屬<strong>中醫文化／養生常識入門</strong>，<strong>唔係診斷、處方、唔取代註冊中醫或西醫</strong>。身體不適請求醫；唔好自行停藥或進補。</div><div class=\"concept\">\n<p>傳統有木－肝、火－心、土－脾、金－肺、水－腎等對應（教材略異）。</p>\n<h4>用法</h4>\n<p>方便記文獻；唔好自我斷病。</p>\n</div>", "diagram": "<div class=\"filled\">木肝青酸｜火心赤苦｜土脾黃甘｜金肺白辛｜水腎黑鹹（傳統記憶口訣，非化驗。）</div><div class=\"q-inline\" data-ans=\"1\"><strong>金常對？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">肝</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">肺</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">脾</button> <span class=\"q-fb\"></span></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>抄表</li><li>遮住默寫</li><li>講出「只係傳統對應」</li><li>拒絕用五行解釋檢查報告</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 可取代驗血？</summary><p>唔可以</p></details>\n<details><summary>Q2. 學佢為？</summary><p>讀文獻／文化記憶</p></details>\n</div>", "more": ["流派差異", "唔好吓小朋友", "飲食標籤別絕對化", "求醫", "聲明", "同記憶宮殿合記表", "思辨短片", "停當娛樂就停"]}, {"title": "氣血津液：概念地圖", "mins": 10, "summary": "氣／血／津液喺文獻中嘅功能詞；動畫示意循環概念。", "goal": "區分三個詞嘅「教科書功能描述」；知紅線。", "takeaway": "詞彙可學；症狀要專業評估。", "concept": "<div class=\"callout safety-xuan\"><strong>重要聲明：</strong>本科屬<strong>中醫文化／養生常識入門</strong>，<strong>唔係診斷、處方、唔取代註冊中醫或西醫</strong>。身體不適請求醫；唔好自行停藥或進補。</div><div class=\"concept\">\n<p>氣常描述推動／防禦等功能語言；血養濡；津液滋潤。重疊同爭議交專業。</p>\n</div>", "diagram": "<svg class=\"anim-svg\" viewBox=\"0 0 320 100\" width=\"100%\" style=\"max-width:320px;background:#faf5ff;border-radius:12px\"><circle class=\"note-pulse\" cx=\"60\" cy=\"50\" r=\"28\" fill=\"#ddd6fe\"/><text x=\"60\" y=\"55\" text-anchor=\"middle\">氣</text><circle class=\"note-pulse dly\" cx=\"160\" cy=\"50\" r=\"28\" fill=\"#fbcfe8\"/><text x=\"160\" y=\"55\" text-anchor=\"middle\">血</text><circle class=\"note-pulse dly2\" cx=\"260\" cy=\"50\" r=\"28\" fill=\"#bae6fd\"/><text x=\"260\" y=\"55\" text-anchor=\"middle\">津</text></svg>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>用自己嘅話各寫一句功能</li><li>列需就醫症狀（胸痛／暈厥等）</li><li>唔買來路不明藥材</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 胸痛？</summary><p>急症求醫</p></details>\n<details><summary>Q2. 自服草藥？</summary><p>危險，問專業</p></details>\n</div>", "more": ["藥食互動", "肝腎毒性風險", "聲明", "正規診所", "別信秘方", "兒童慎", "記錄", "科學檢查並行"]}, {"title": "臟腑：五臟六腑名稱入門", "mins": 11, "summary": "記名稱同「藏象」係功能模型；附聲明。", "goal": "列出五臟六腑名；解釋藏象≠解剖一一對等。", "takeaway": "同名器官中西概念唔全等。", "concept": "<div class=\"callout safety-xuan\"><strong>重要聲明：</strong>本科屬<strong>中醫文化／養生常識入門</strong>，<strong>唔係診斷、處方、唔取代註冊中醫或西醫</strong>。身體不適請求醫；唔好自行停藥或進補。</div><div class=\"concept\">\n<p>五臟：心肝脾肺腎；六腑：膽胃小腸大腸膀胱三焦（教材）。</p>\n<h4>重要</h4>\n<p>中醫「脾」唔等於西醫脾臟全部含義。</p>\n</div>", "diagram": "<div class=\"tap-board\"><div class=\"tip\">撳位點睇提示</div><div class=\"tap-zones\"><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"傳統神志／血脈敘事——詞彙。\">心</button><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"運化敘事——≠西醫脾全等。\">脾</button><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"宣降敘事。\">肺</button><but >傳統強調起居有常。現代對應：睡眠衛生、活動量、均衡飲食。</p>\n<h4>唔係</h4>\n<p>空腹極端斷食自稱中醫一定要。</p>\n</div>", "diagram": "<div class=\"filled\">可執行例：固定睡眠窗；每日步行；蔬果蛋白質來源多樣——唔保證治病。</div><div class=\"timer-box\" data-work=\"60\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">伸展 60 秒（非治療）</button></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>寫 3 條作息</li><li>刪 1 個無證據偏方</li><li>身體警告信號列表</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 極端偏方？</summary><p>停＋問醫生</p></details>\n<details><summary>Q2. 養生核心？</summary><p>規律同安全</p></details>\n</div>", "more": ["慢病跟醫生", "懷孕獨立建議", "運動傷害防範", "聲明", "別恥辱肥胖敘事", "心理健康求援", "喝酒風險", "煙害"]}, {"title": "穴位常識：位置文化同安全", "mins": 11, "summary": "認識穴位係體表刺激點傳統體系；安全：唔亂紮針艾灸。", "goal": "知合谷／足三里「文化知名度」；列安全紅線。", "takeaway": "穴位興趣≠可以自紮。", "concept": "<div class=\"callout safety-xuan\"><strong>重要聲明：</strong>本科屬<strong>中醫文化／養生常識入門</strong>，<strong>唔係診斷、處方、唔取代註冊中醫或西醫</strong>。身體不適請求醫；唔好自行停藥或進補。</div><div class=\"concept\">\n<p>穴位有名稱同定位傳統。針灸屬醫療行為，需資格。</p>\n<h4>安全</h4>\n<p>皮膚感染、燙傷、孕忌、出血病慎。</p>\n</div>", "diagram": "<div class=\"tap-board\"><div class=\"tip\">撳位點睇提示</div><div class=\"tap-zones\"><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"手部知名穴——只記名字，唔教你紮。\">合谷</button><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"小腿知名穴——同樣只係文化認知。\">足三里</button><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"唔自行針刺／重度艾灸。\">安全</button></div><div class=\"tap-out blank\">撳上面睇提示</div></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>讀安全紅線</li><li>唔買來歷不明針具</li><li>興趣轉正規課程／診所</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 可自紮？</summary><p>唔可以（無資格）</p></details>\n<details><summary>Q2. 燙傷？</summary><p>艾灸風險</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>興趣應？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">直播跟紮</button> <button type=\"button\" class=\"sm\ : 9, "summary": "椅子、螢幕、微休息；護眼護體一齊。", "goal": "做一次 2 分鐘肩頸放鬆；調椅高。", "takeaway": "微休息防累積勞損；痛持續求醫。", "concept": "<div class=\"callout\"><strong>教育提示：</strong>護眼護膚常識；皮膚／眼疾請睇醫生或註冊專業。以下唔係個人化醫囑。</div><div class=\"concept\">\n<p>螢幕頂約眼水平或略低；腳踏實。</p>\n</div>", "diagram": "<div class=\"timer-box\" data-work=\"120\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">肩頸放鬆 2 分</button></div><div class=\"filled\">每小時：企起、望遠、滾肩、喝水。</div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>調椅</li><li>設每小時鬧鐘</li><li>2 分滾肩</li><li>痛麻放射求醫</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 手麻持續？</summary><p>求醫</p></details>\n<details><summary>Q2. 微休息？</summary><p>每小時</p></details>\n</div>", "more": ["人因工程", "站立桌交替", "聲明", "運動前置熱身"]}, {"title": "護膚：敏感同「少即是多」", "mins": 8, "summary": "辨刺激徵兆；停用順序；何時睇皮膚科。", "goal": "寫停用流程卡；知急症徵兆。", "takeaway": "愈刺激愈要減法。", "concept": "<div class=\"callout\"><strong>教育提示：</strong>護眼護膚常識；皮膚／眼疾請睇醫生或註冊專業。以下唔係個人化醫囑。</div><div class=\"concept\">\n<p>刺痛、大面積紅、腫，停新產品。呼吸困難屬急症。</p>\n</div>", "diagram": "<div class=\"filled\">停新變因 → 溫和清潔保濕 → 唔好亂搽激素（除非醫囑）→ 惡化求診。</div><div class=\"q-inline\" data-ans=\"1\"><strong>臉腫氣喘？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">再敷面膜</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">急診</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">加大酸</button> <span class=\"q-fb\"></span></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>列近兩週新產品</li><li>寫停用卡</li><li>拍照記錄（私密保存）</li></ol>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 自行強效激素？</summary><p>危險</p></details>\n<details><summary>Q2. 少即是多？</summary><p>減刺激</p></details>\n</div>", "more": ["補丁", "化妝品保存", "教育", "皮膚科資格"]}, {"title": "綜合：每日護眼護膚清單", "mins": 9, "summary": "可打卡清單：遠望、眨眼、光、清潔保濕防曬、微休息。", "goal": "勾完整日清單一輪；統計學完。", "takeaway": "系統習慣勝偶然大改造。", "concept": "<div class=\"callout\"><strong>教育提示：</strong> =\"q-fb\"></span></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>大聲讀聲明</li><li>寫「我會用周易嚟……／唔會用嚟……」</li><li>列一個傳媒濫用例子</li></ol><div class=\"blank\">會：…\n唔會：…\n媒體例：…</div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 本科定位？</summary><p>文化思辨非斷命</p></details>\n<details><summary>Q2. 病痛？</summary><p>求醫唔靠卦</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>聲明目的？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">嚇人</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">劃清學習同迷信／詐騙</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">賣課</button> <span class=\"q-fb\"></span></div>", "more": ["可讀通行繁中譯注", "比較哲學史寫法", "唔買保證靈驗服務", "同媒體素養合用", "記錄來源", "保持好奇同懷疑", "兒童勿恐嚇", "完結返現實決策"]}, {"title": "陰陽爻：符號基本單位", "mins": 10, "summary": "陽爻（—）陰爻（- -）；由下往上讀；互動辨認。", "goal": "畫出陰陽爻；說出「初爻在下」；完成自測。", "takeaway": "爻係二元符號；組合先成卦。", "concept": "<div class=\"callout safety-xuan\"><strong>重要聲明：</strong>本科屬<strong>周易文化／哲學思辨學習</strong>，<strong>唔係命運斷語、唔係投資／醫療／法律建議</strong>，亦唔鼓勵迷信或用卦象取代專業意見。身體、財務、法律問題請找合資格專業人士。</div><div class=\"concept\">\n<p>陽爻常記作實線，陰爻作斷開兩段。</p>\n<h4>讀序</h4>\n<p>由下往上：初、二、三、四、五、上。</p>\n<h4>提醒</h4>\n<p>符號本身唔等於命運開關。</p>\n</div>", "diagram": "<svg class=\"anim-svg\" viewBox=\"0 0 280 160\" width=\"100%\" style=\"max-width:280px;background:#fff7ed;border-radius:12px\">\n  <text x=\"20\" y=\"28\" font-size=\"13\" fill=\"#9a3412\">陽爻 —</text>\n  <rect class=\"note-pulse\" x=\"100\" y=\"14\" width=\"150\" height=\"14\" rx=\"3\" fill=\"#b45309\"/>\n  <text x=\"20\" y=\"70\" font-size=\"13\" fill=\"#9a3412\">陰爻 - -</text>\n  <rect class=\"note-pulse dly\" x=\"100\" y=\"56\" width=\"65\" height=\"14\" rx=\"3\" fill=\"#d97706\"/>\n  <rect class=\"note-pulse dly\" x=\"185\" y=\"56\" width=\"65\" height=\"14\" rx=\"3\" fill=\"#d97706\"/>\n  <text x=\"20\" y=\"120\" font-size=\"12\" fill=\"#78350f\">由下往上數：初→二→三→四→五→上</text>\n</svg><div class=\"tap-board\"><div class=\"tip\">撳位點睇提示</div><div class=\"tap-zones\"><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"實線；傳統聯想「剛／動」等詞彙——當符號學。\">陽</button><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"斷開；傳統聯想「柔／靜」等——當符號學。\">陰</button><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"最下面一爻。\">初爻</button></div><div class=\"tap-out blank\">撳上面睇提示</div></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>白紙畫三陽三陰</li><li>標初→上</li><li>同桌互考符號名</li><li>拒絕「爻決定你一生」說法</li></ol><div class=\"blank\">默寫六爻位置名：…</div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 初爻位置？</summary><p>最下</p></details>\n<details><summary>Q2. 陰爻畫法？</summary><p>中斷兩段</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>由邊度數？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">上到下</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">下到上</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">中間起</button> <span class=\"q-fb\"></span></div>", "more": ["可用筷子模擬", "記口訣「初二三四五上」", "唔好神秘化筆劃", "同記憶宮殿合記", "練習速度", "書法興趣另論", "保持輕鬆", "導出統計"]}, {"title": "八卦：八個三爻基本卦", "mins": 12, "summary": "乾兌離震巽坎艮坤；自然取象記憶；SVG 方位示意。", "goal": "背八個卦名＋符號；能配一組常見取象（如乾為天）。", "takeaway": "八卦＝三爻組合；取象係傳統詩學，唔係物理定律。", "concept": "<div class=\"callout safety-xuan\"><strong>重要聲明：</strong>本科屬<strong>周易文化／哲學思辨學習</strong>，<strong>唔係命運斷語、唔係投資／醫療／法律建議</strong>，亦唔鼓勵迷信或用卦象取代專業意見。身體、財務、法律問題請找合資格專業人士。</div><div class=\"concept\">\n<p>三爻有 2³＝8 種組合，即八卦。</p>\n<h4>常見取象口訣（記憶用）</h4>\n<p>乾天、坤地、震雷、巽風、坎水、離火、艮山、兌澤。</p>\n<h4>注意</h4>\n<p>後世圖式（先天／後天）有多套，入門先記名同符。</p>\n</div>", "diagram": "<svg class=\"anim-svg\" viewBox=\"0 0 320 320\" width=\"100%\" style=\"max-width:320px;background:#fffbeb;border-radius:16px\">\n  <circle cx=\"160\" cy=\"160\" r=\"140\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"2\"/>\n  <circle cx=\"160\" cy=\"160\" r=\"36\" fill=\"#fef3c7\" stroke=\"#92400e\"/>\n  <text x=\"160\" y=\"166\" text-anchor=\"middle\" font-size=\"14\" fill=\"#78350f\">太極</text>\n  <g font-size=\"12\" fill=\"#92400e\" text-anchor=\"middle\">\n    <text x=\"160\" y=\"40\">乾 ☰</text><text x=\"250\" y=\"80\">兌 ☱</text>\n    <text x=\"280\" y=\"168\">離 ☲</text><text x=\"250\" y=\"250\">震 ☳</text>\n    <text x=\"160\" y=\"290\">巽 ☴</text><text x=\"70\" y=\"250\">坎 ☵</text>\n    <text x=\"40\" y=\"168\">艮 ☶</text><text x=\"70\" y=\"80\">坤 ☷</text>\n  </g>\n</svg><div class=\"tap-board\"><div class=\"tip\">撳位點睇提示</div><div class=\"tap-zones\"><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"三陽；取象「天」——記憶用。\">乾☰</button><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"三陰；取象「地」。\">坤☷</button><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"中間陽；取象「水」。\">坎☵</button><button type=\"button\" class=\"tap-zone\" data-act=\"tapzone\" data-tip=\"中間陰；取象「火」。\">離☲</button></div><div class=\"tap-out blank\">撳上面睇提示</div></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>抄八卦名＋符</li><li>遮住默寫</li><li>用取象做聯想卡</li><li>講一句：取象≠科學因果</li></ol><div class=\"blank\">八卦默寫：…</div><div class=\"timer-box\" data-work=\"120\" data-rest=\"0\"><span class=\"timer-display\">--:--</span> <button type=\"button\" class=\"sm primary\" data-act=\"timer\">限時默寫 2 分</button></div>", "quiz": "<div class=\"quiz\">\n<details><summary>Q1. 八卦幾多？</summary><p>八</p></details>\n<details><summary>Q2. 乾取象常係？</summary><p>天（傳統）</p></details>\n</div><div class=\"q-inline\" data-ans=\"1\"><strong>離中間係？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">陽</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">陰</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">空</button> <span class=\"q-fb\"></span></div>", "more": ["歌訣輔助", "畫符要齊", "比較不同教材圖", "唔好用嚟嚇小朋友", "聲明常在", "可讀哲學導論", "同五行課分開唔硬套", "完結"]}, {"title": "六十四卦概論：上下卦組合", "mins": 12, "summary": "上卦＋下卦＝六爻卦；64＝8×8；示例圖非斷命。", "goal": "解釋「重卦」；指出一卦嘅上卦下卦；完成配對題。", "takeaway": "六十四卦係組合空間；經文另有卦辭爻辭傳統。", "concept": "<div class=\"callout safety-xuan\"><strong>重要聲明：</strong>本科屬<strong>周易文化／哲學思辨學習</strong>，<strong>唔係命運斷語、唔係投資／醫療／法律建議</strong>，亦唔鼓勵迷信或用卦象取代專業意見。身體、財務、法律問題請找合資格專業人士。</div><div class=\"concept\">\n<p>兩個三爻卦相疊成六爻卦，共六十四。</p>\n<h4>結構</h4>\n<p>下卦（內／貞）＋上卦（外／悔）——詞彙入門。</p>\n<h4>經文</h4>\n<p>每卦有卦名、卦辭；每爻有爻辭（傳世文本）。</p>\n</div>", "diagram": "<svg class=\"anim-svg\" viewBox=\"0 0 200 220\" width=\"100%\" style=\"max-width:200px;background:#fffbeb;border-radius:12px\">\n  <text x=\"100\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" fill=\"#92400e\">示例：既濟示意（非斷命）</text>\n  <g transform=\"translate(40,40)\">\n    <rect class=\"note-pulse\" y=\"0\" width=\"120\" height=\"12\" rx=\"2\" fill=\"#b45309\"/>\n    <rect class=\"note-pulse dly\" y=\"22\" width=\"50\" height=\"12\" rx=\"2\" fill=\"#d97706\"/><rect class=\"note-pulse dly\" x=\"70\" y=\"22\" width=\"50\" height=\"12\" rx=\"2\" fill=\"#d97706\"/>\n    <rect class=\"note-pulse dly2\" y=\"44\" width=\"120\" height=\"12\" rx=\"2\" fill=\"#b45309\"/>\n    <rect y=\"66\" width=\"50\" height=\"12\" rx=\"2\" fill=\"#d97706\"/><rect x=\"70\" y=\"66\" width=\"50\" height=\"12\" rx=\"2\" fill=\"#d97706\"/>\n    <rect y=\"88\" width=\"120\" height=\"12\" rx=\"2\" fill=\"#b45309\"/>\n    <rect y=\"110\" width=\"50\" height=\"12\" rx=\"2\" fill=\"#d97706\"/><rect x=\"70\" y=\"110\" width=\"50\" height=\"12\" rx=\"2\" fill=\"#d97706\"/>\n  </g>\n  <text x=\"100\" y=\"200\" text-anchor=\"middle\" font-size=\"11\" fill=\"#78350f\">下卦／上卦各三爻</text>\n</svg><div class=\"q-inline\" data-ans=\"1\"><strong>六十四點解係64？</strong> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"0\">隨便</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"1\">8×8上下組合</button> <button type=\"button\" class=\"sm\" data-act=\"quizpick\" data-i=\"2\">天定</button> <span class=\"q-fb\"></span></div>", "practice": "<h4>練習</h4><ol class=\"steps\"><li>揀一卦名（如「泰」「否」）查係邊兩個三爻</li function ensureAudio(){

function beep(freq, dur, type, gain){
  if(isMuted()) return;
  try{
    const ctx=ensureAudio();
    const o=ctx.createOscillator(); const g=ctx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;

}

function playTone(freq, dur, type, gain, when){
  if(isMuted()) return;
  try{
    const ctx=ensureAudio();
    const o=ctx.createOscillator(); const g=ctx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(ctx.destination);
    const t=(when==null?ctx.currentTime:when);
    g.gain.setValueAtTime(gain||0.06,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+(dur||0.35));
    o.start(t); o.stop(t+(dur||0.35)+0.02);
  }catch(e){}
}

}

  const fifth=Math.pow(2,7/12); const ctx=ensureAudio(); const t=ctx.currentTime;
  playTone(base,0.7,'sine',0.05,t); playTone(base*third,0.7,'sine',0.05,t); playTone(base*fifth,0.7,'sine',0.05,t);
}
function playCadence(kind){
  const ctx=ensureAudio(); const t=ctx.currentTime;

  else { chord([C,E,G],t); chord([G,B,D],t+0.65); }
}

function lessonIndex(cat){
  const d=hkNow();
  const seed=hashStr(ymd(d))+getShift()*17;
  const arr=BANK[cat];
  const base=(seed + ORDER.indexOf(cat)*3) % arr.length;
  const off=(getCatOff()[cat]|0);
  return (base + off + arr.length*20) % arr.length;
}

function currentLesson(){
  const cat=activeCat;
  const idx=lessonIndex(cat);
  const item=BANK[cat][idx];
  return {cat, idx, id:lessonId(cat,idx), ...item, ...CAT_META[cat]};
}

function clipEscape(s){
  return String(s||'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function renderClips(){
  const box=document.getElementById('clipList');
  if(!box) return;
  const clips=loadJSON(LS_CLIPS,[]);
  if(!clips.length){
    box.innerHTML='<div class="empty with-mascot">'+mascotHTML('cat','mascot-empty mascot-bounce')+'<div>未有文字片段。去「今日課」反白一段文字即可收藏到呢本筆記。</div></div>';
    return;
  }
  const sorted=clips.slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  box.innerHTML=sorted.map(c=>{
    const src=c.sourceTitle?clipEscape(c.sourceTitle):'(未知課)';
    const catLabel=(CAT_META[c.cat]&&CAT_META[c.cat].short)||c.cat||'';
    const when=c.dateHK||'';
    return `<article class="clip-card" data-clip="${clipEscape(c.id)}">
      <div class="meta">${clipEscape(catLabel)} · ${src} · <time>${clipEscape(when)}</time></div>
      <div class="clip-text">${clipEscape(c.text)}</div>
      <label class="tip">個人備註</label>
      <textarea data-act-clipnote="${clipEscape(c.id)}" placeholder="可寫點解鐘意／點用…">${clipEscape(c.note||'')}</textarea>
      <div class="clip-actions">
        <button type="button" class="sm" data-act="clipopen" data-id="${clipEscape(c.sourceId||'')}">打開來源課</button>
        <button type="button" class="sm" data-act="clipspeak" data-id="${clipEscape(c.id)}">🔊 朗讀</button>
        <button type="button" class="sm" data-act="clipdel" data-id="${clipEscape(c.id)}">刪除片段</button>
      </div>
    </article>`;
  }).join('');
}

function currentLessonMeta(){
  const card=document.querySelector('#panel-today .card, #favDetail .card');
  if(!card) return {sourceId:'', sourceTitle:'', cat:activeCat||''};
  const id=card.dataset.id||'';
  const titleEl=card.querySelector('h2, .card-title, .t-title');
  let title=titleEl?titleEl.textContent.trim():'';
  if(!title && id && id.indexOf(':')>-1){
    const [cat,idxS]=id.split(':'); const idx=+idxS;
    if(BANK[cat]&&BANK[cat][idx]) title=BANK[cat][idx].title;
  }
  const cat=id&&id.indexOf(':')>-1?id.split(':')[0]:(activeCat||'');
  return {sourceId:id, sourceTitle:title, cat:cat};
}

function saveClipFromSelection(selText, rect){
  const t=String(selText||'').trim();
  if(t.length<2){ toast('反白再長少少再收藏'); return; }
  if(t.length>2000){ toast('片段太長，試下短啲'); return; }
  const meta=currentLessonMeta();
  const now=hkNow();
  const clip={
    id:'c'+Date.now()+'_'+Math.floor(Math.random()*1e4),
    text:t,
    note:'',
    sourceId:meta.sourceId||'',
    sourceTitle:meta.sourceTitle||'',
    cat:meta.cat||'',
    dateHK:ymd(now)+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
    ts:Date.now()
  };
  const clips=loadJSON(LS_CLIPS,[]);
  clips.push(clip);
  saveJSON(LS_CLIPS,clips);
  toast('已放入文字筆記本'); sfxOk();
  hideClipPop();
  if(document.getElementById('panel-fav').classList.contains('active')) renderClips();
}

let clipPopTimer=null;
function hideClipPop(){
  const pop=document.getElementById('clipPop');
  if(pop){ pop.hidden=true; pop.innerHTML=''; }
}
function showClipPop(x,y,text){
  const pop=document.getElementById('clipPop');
  if(!pop) return;
  pop.hidden=false;
  pop.style.left=Math.max(60, Math.min(window.innerWidth-60, x))+'px';
  pop.style.top=Math.max(40, y)+'px';
  pop.innerHTML='<span>反白收藏</span><button type="button" id="btnSaveClip">☆ 收藏片段</button>';
  const btn=document.getElementById('btnSaveClip');
  btn.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); saveClipFromSelection(text); };
}

function selectionInLesson(){
  const sel=window.getSelection && window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const t=String(sel.toString()||'').trim();
  if(t.length<2) return null;
  const node=sel.anchorNode && (sel.anchorNode.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode);
  if(!node || !node.closest) return null;
  const root=node.closest('.card .body, .card, #panel-today, #favDetail, [data-secpanel]');
  if(!root) return null;
  // ignore if selection inside clip notebook itself
  if(node.closest('#clipList, #clipPop, textarea, input, button')) return null;
  let rect=null;
  try{ rect=sel.getRangeAt(0).getBoundingClientRect(); }catch(e){}
  return {text:t, rect:rect};
}

    if(!info){ hideClipPop(); return; }
    const r=info.rect||{left:window.innerWidth/2,top:80,width:0,height:0};
    showClipPop(r.left+r.width/2, r.top, info.text);

});

  off[activeCat]=((off[activeCat]|0)+delta);

  activeSec='goal';

  renderToday();
}

let rhythmTimer=null;
function startRhythm(){
  stopRhythm();
  let i=0;
  const mark=()=>{
    for(let k=0;k<4;k++){ const el=document.getElementById('b'+k); if(el) el.classList.toggle('on',k===i%4); }
    sfxTick(); i++;
  };
  mark();
  rhythmTimer=setInterval(mark,1000);
}
function stopRhythm(){ if(rhythmTimer){ clearInterval(rhythmTimer); rhythmTimer=null; } }

function runTimer(btn){
  const box=btn.closest('.timer-box'); if(!box) return;
  const work=+(box.dataset.work||30);
  const rest=+(box.dataset.rest||0);
  const disp=box.querySelector('.timer-display');
  if(timerHandle){ clearInterval(timerHandle); timerHandle=null; }
  let phase='work', left=work;
  const paint=()=>{ const m=Math.floor(left/60), s=left%60; disp.textContent=(phase==='rest'?'休 ':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); };
  paint(); sfxOk();
  timerHandle=setInterval(()=>{
    left--; paint();
    if(left<=0){
      if(phase==='work' && rest>0){ phase='rest'; left=rest; sfxTick(); paint(); }
      else { clearInterval(timerHandle); timerHandle=null; disp.textContent='完成'; sfxOk(); confetti(); }
    }
  },1000);
}

document.querySelector('.app').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-act]');
  if(!btn) return;
  const act=btn.dataset.act;
  if(act==='sec'){
    activeSec=btn.dataset.sec; sfxClick();
    const root=btn.closest('.body');
    root.querySelectorAll('.sec-nav button').forEach(b=>b.classList.toggle('active',b.dataset.sec===activeSec));
    root.querySelectorAll('[data-secpanel]').forEach(p=>p.classList.toggle('open',p.dataset.secpanel===activeSec));
    return;
  }
  if(act==='more'){
    const el=document.getElementById(btn.dataset.target);
    if(el){ el.classList.toggle('open'); btn.textContent=el.classList.contains('open')?'收起':'睇更多'; sfxClick(); }
    return;
  }
  if(act==='clipdel'){
    const clips=loadJSON(LS_CLIPS,[]).filter(c=>c.id!==btn.dataset.id);
    saveJSON(LS_CLIPS,clips); toast('已刪除片段'); sfxClick(); renderClips(); return;
  }
  if(act==='clipopen'){
    const id=btn.dataset.id; if(!id||id.indexOf(':')<0){ toast('無來源課'); return; }
    const favs=loadJSON(LS_FAV,{});
    favs[id]=favs[id]||Date.now(); saveJSON(LS_FAV,favs);
    favOpenId=id;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='fav'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-fav').classList.add('active');
    renderFav(); sfxOk(); return;
  }
  if(act==='clipspeak'){ const clips=loadJSON(LS_CLIPS,[]); const hit=clips.find(c=>c.id===btn.dataset.id); speakAny((hit&&hit.text)||btn.dataset.en||''); return; }
  if(act==='fav'){
    const favs=loadJSON(LS_FAV,{});
    if(favs[btn.dataset.id]){ delete favs[btn.dataset.id]; toast('已取消收藏'); sfxClick(); }
    else { favs[btn.dataset.id]=Date.now(); toast('已收藏'); sfxOk(); btn.classList.add('heart-pop'); }
    saveJSON(LS_FAV,favs);
    renderToday(); if(document.getElementById('panel-fav').classList.contains('active')) renderFav();
    return;
  }
  if(act==='done'){
    const day=ymd(hkNow());
    const dones=loadJSON(LS_DONE,{});
    if(!dones[day]) dones[day]={};
    if(dones[day][btn.dataset.id]){ delete dones[day][btn.dataset.id]; toast('取消學完'); sfxClick(); }
    else { dones[day][btn.dataset.id]=1; toast('做得好，學完！'); sfxOk(); confetti(); try{const cat=(btn.dataset.id||'').split(':')[0]; celebrateMascot(cat);}catch(e){} }
    saveJSON(LS_DONE,dones);
    renderToday();
    return;
  }
  if(act==='speak'){ speakAny(btn.dataset.en||'', btn.dataset.lang||'en-US'); return; }
  if(act==='tapzone'){ const out=btn.closest('.tap-board')&&btn.closest('.tap-board').querySelector('.tap-out'); if(out){ out.textContent=btn.dataset.tip||''; sfxClick(); } return; }
  if(act==='playinterval'){ playIntervalSemi(btn.dataset.semi); sfxClick(); return; }
  if(act==='playchord'){ playChord(btn.dataset.chord); sfxClick(); return; }
  if(act==='playcadence'){ playCadence(btn.dataset.cad); sfxClick(); return; }
  if(act==='quizpick'){
    const wrap=btn.closest('.q-inline'); if(!wrap) return;
    const ans=+wrap.dataset.ans; const pick=+btn.dataset.i;
    const fb=wrap.querySelector('.q-fb');
    if(pick===ans){ fb.textContent='✓ 啱'; fb.className='q-fb ok'; sfxOk(); }
    else { fb.textContent='✗ 再試'; fb.className='q-fb bad'; sfxBad(); }
    return;
  }
  if(act==='timer'){ runTimer(btn); return; }
  if(act==='rhythm'){ startRhythm(); return; }
  if(act==='rhythmStop'){ stopRhythm(); return; }
  if(act==='favopen'){ favOpenId=btn.dataset.id; sfxClick(); renderFav(); return; }
  if(act==='favback'){ favOpenId=null; sfxClick(); renderFav(); return; }
});

function doneSetToday(){ return loadJSON(LS_DONE,{})[ymd(hkNow())]||{}; }
function completionByCat(){
  const dones=loadJSON(LS_DONE,{});
  const doneIds=new Set();
  Object.values(dones).forEach(m=>Object.keys(m||{}).forEach(id=>doneIds.add(id)));
  const out={};
  ORDER.forEach(cat=>{
    let done=0; const total=(BANK[cat]||[]).length;
    for(let i=0;i<total;i++){ if(doneIds.has(lessonId(cat,i))) done++; }
    out[cat]={done,total,pct: total?Math.round(done*100/total):0};
  });
  return out;
}
function calcStreak(){
  const dones=loadJSON(LS_DONE,{}); let streak=0; const d=hkNow();
  for(let i=0;i<400;i++){
    const key=ymd(d); const obj=dones[key]||{};
    if(Object.keys(obj).length>0){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function renderStats(){
  const by=completionByCat(); const today=Object.keys(doneSetToday()).length; const streak=calcStreak();
  let totalDone=0,total=0; ORDER.forEach(c=>{ totalDone+=by[c].done; total+=by[c].total; });
  const boxes=document.getElementById('statsBoxes'); if(!boxes) return;
  let html=`<div class="stat-card"><div class="l">今日已學</div><div class="n">${today}</div></div>
    <div class="stat-card"><div class="l">累計完成（按課 id）</div><div class="n">${totalDone}</div><div class="l">目錄 ${total} 則</div>
      <div class="bar"><i style="width:${total?Math.round(totalDone*100/total):0}%"></i></div></div>
    <div class="stat-card"><div class="l">連續有學習日</div><div class="n">${streak}</div></div>`;
  ORDER.forEach(c=>{ const x=by[c];
    html+=`<div class="stat-card"><div class="l">${CAT_META[c].short}</div><div class="n">${x.pct}%</div>
      <div class="l">${x.done}/${x.total}</div><div class="bar"><i style="width:${x.pct}%;background:var(--${c})"></i></div></div>`; });
  boxes.innerHTML=html;
  const syl=document.getElementById('syllabus');
  if(syl){ syl.innerHTML=ORDER.map(cat=>{
    const items=(BANK[cat]||[]).map(L=>`<li><strong>${L.title}</strong> · ${L.mins||'?'}分 — ${L.summary||''}</li>`).join('');
    return `<details><summary>${CAT_META[cat].label}（${(BANK[cat]||[]).length}）</summary><ol>${items}</ol></details>`;
  }).join(''); }
}
function downloadBlob(filename, mime, text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime}));
  a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportJSON(){
  const payload={exportedAt:new Date().toISOString(),timeZone:'Asia/Hong_Kong',completion:completionByCat(),streak:calcStreak(),
    doneMap:loadJSON(LS_DONE,{}),favs:loadJSON(LS_FAV,{}),clips:loadJSON(LS_CLIPS,[]),
    catalog:ORDER.map(cat=>({cat,label:CAT_META[cat].label,lessons:(BANK[cat]||[]).map((L,i)=>({i,title:L.title,mins:L.mins,summary:L.summary,goal:L.goal,takeaway:L.takeaway}))}))};
  downloadBlob('DailyQuest-export-'+ymd(hkNow())+'.json','application/json',JSON.stringify(payload,null,2));
  toast('已導出 JSON'); sfxOk();
}
function exportCSV(){
  const by=completionByCat(); const dones=loadJSON(LS_DONE,{}); const doneIds=new Set();
  Object.values(dones).forEach(m=>Object.keys(m||{}).forEach(id=>doneIds.add(id)));
  let lines=['category,category_label,index,title,mins,done,summary'];
  ORDER.forEach(cat=>{(BANK[cat]||[]).forEach((L,i)=>{
    const done=doneIds.has(lessonId(cat,i))?'1':'0';
    lines.push(`"${cat}","${CAT_META[cat].label}",${i},"${(L.title||'').replace(/"/g,'""')}",${L.mins||''},${done},"${(L.summary||'').replace(/"/g,'""')}"`);
  });});
  lines.push('','category,pct,done,total');
  ORDER.forEach(c=>lines.push(`${c},${by[c].pct},${by[c].done},${by[c].total}`));
  downloadBlob('DailyQuest-progress-'+ymd(hkNow())+'.csv','text/csv;charset=utf-8','\uFEFF'+lines.join('\n'));
  toast('已導出 CSV'); sfxOk();
}
function exportHTML(){
  const by=completionByCat();
  let body='<h1>六藝日課 · 學習清單</h1><p>導出日（Asia/Hong_Kong）：'+ymd(hkNow())+' · 連續 '+calcStreak()+' 日</p>';
  ORDER.forEach(cat=>{
    body+=`<h2>${CAT_META[cat].label}（${by[cat].done}/${by[cat].total} · ${by[cat].pct}%）</h2><ol>`;
    (BANK[cat]||[]).forEach(L=>{ body+=`<li><strong>${L.title}</strong>（${L.mins||'?'}分）<br>${L.summary||''}<br><em>${L.takeaway||''}</em></li>`; });
    body+='</ol>';
  });
  downloadBlob('DailyQuest-syllabus-'+ymd(hkNow())+'.html','text/html;charset=utf-8',
    '<!DOCTYPE html><html lang="zh-Hant"><meta charset="UTF-8"><title>DailyQuest 清單</title><body style="font-family:sans-serif;max-width:800px;margin:24px auto;line-height:1.5">'+body+'</body></html>');
  toast('已導出可列印 HTML'); sfxOk();
}

document.addEventListener('change',function(e){
  const ta=e.target.closest && e.target.closest('textarea[data-act-clipnote]');
  if(!ta) return;
  const id=ta.getAttribute('data-act-clipnote');
  const clips=loadJSON(LS_CLIPS,[]);
  const hit=clips.find(c=>c.id===id);
  if(hit){ hit.note=ta.value; saveJSON(LS_CLIPS,clips); toast('備註已存'); }
});

document.getElementById('btnExportJSON')&&document.getElementById('btnExportJSON').addEventListener('click',exportJSON);
document.getElementById('btnExportCSV')&&document.getElementById('btnExportCSV').addEventListener('click',exportCSV);
document.getElementById('btnExportHTML')&&document.getElementById('btnExportHTML').addEventListener('click',exportHTML);

})();
</script>
